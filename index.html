function respondModal() {
  const s = S(), pd = s.pending, p = me();
  const jsn = p.hand.filter(id => Engine.isAct(id, 'jsn')).length;
  const kJ = cb(() => send({ t: 'jsn' }));
  const jsnBtn = jsn ? `<button class="danger" data-k="${kJ}">✋ Reddet <small>(elinde ${jsn})</small></button>` : '';
  if (pd.stage === 'actor') {
    const btns = `${jsn ? `<button class="danger" data-k="${kJ}">✋ Reddet (${jsn})</button>` : ''}<button data-k="${cb(() => send({ t: 'accept' }))}">Kabul et (hamle iptal)</button>`;
    return sheetTop(`${pname(pd.cur)} hamleni reddetti`, `${describePending(s)}. Sen de Reddet oynarsan hamlen geçerli olur.`, btns);
  }
  const title = `<h3>${describePending(s)}</h3>`;
  if (pd.kind === 'steal') {
    const secs = [];
    if (pd.act === 'dealbreaker') {
      const st = p.stacks.find(x => x.sid === pd.sid);
      if (st) { const col = COLORS[st.color]; const cards = st.cards.map(x => ({ id: x, color: st.color, ro: true }));
        if (st.house != null) cards.push({ id: st.house, ro: true }); if (st.hotel != null) cards.push({ id: st.hotel, ro: true });
        secs.push({ label: `Senden alınacak set · ${col.n}`, hex: col.hex, cards }); }
    } else {
      const tc = Engine.colorOnTable(p, pd.take);
      secs.push({ label: 'Senden alınacak', hex: tc ? COLORS[tc].hex : '#c0392b', cards: [{ id: pd.take, color: tc, ro: true, hl: true }] });
      if (pd.act === 'forced') { const gc = Engine.colorOnTable(s.players[pd.actor], pd.give); secs.push({ label: 'Sana verilecek', hex: gc ? COLORS[gc].hex : '#2e8b57', cards: [{ id: pd.give, color: gc, ro: true }] }); }
    }
    const btns = `${jsn ? `<button class="danger" data-k="${kJ}">✋ Reddet (${jsn})</button>` : ''}<button class="primary" data-k="${cb(() => send({ t: 'accept' }))}">Kabul et</button>`;
    return sheetTop(describePending(s), jsn ? 'Reddet kartınla bu hamleyi iptal edebilirsin.' : 'Elinde Reddet kartı yok.', btns) + cardSecs(secs);
  }

  // ödeme
  const sel = app.ui.sel;
  const total = Engine.assetTotal(p);
  const sum = [...sel].reduce((x, id) => x + C(id).v, 0);
  const valid = sum >= pd.amount || sum >= total;
  const toggle = id => cb(() => { sel.has(id) ? sel.delete(id) : sel.add(id); render(); });
  const bank = p.bank.slice().sort((a, b) => C(a).v - C(b).v).map(id => cardHTML(id, { size: 'md', k: toggle(id), sel: sel.has(id) })).join('');
  const table = p.stacks.map(st => {
    const cards = st.cards.map(id => cardHTML(id, { size: 'md', color: st.color, k: C(id).v > 0 ? toggle(id) : null, sel: sel.has(id) })).join('');
    const b = [st.house, st.hotel].filter(x => x != null).map(id => cardHTML(id, { size: 'md', k: toggle(id), sel: sel.has(id) })).join('');
    return cards + b;
  }).join('');
  const kAuto = cb(() => { app.ui.sel = new Set(Bot.choosePayment(p, pd.amount)); render(); });
  const kPay = cb(() => send({ t: 'pay', cards: [...sel] }));
  return `${title}
    <div class="row"><span class="pill gold">Borç ${pd.amount}M</span><span class="pill">Seçilen ${sum}M</span><span class="pill">Toplam varlığın ${total}M</span>${total < pd.amount ? '<span class="muted">Yetmiyor: her şeyini vermelisin.</span>' : ''}</div>
    ${jsnBtn ? `<div class="row">${jsnBtn}<span class="muted">ya da ödeyeceğin kartları seç:</span></div>` : '<div class="muted">Ödeyeceğin kartları seç (para üstü verilmez):</div>'}
    <div><b>Banka</b><div class="pickgrid">${bank || '<span class="muted">boş</span>'}</div></div>
    <div><b>Masa</b><div class="pickgrid">${table || '<span class="muted">boş</span>'}</div></div>
    <div class="row"><button data-k="${kAuto}">Otomatik seç</button><button class="primary" ${valid ? '' : 'disabled'} data-k="${kPay}">${sum ? `${sum}M öde` : 'Öde'}</button></div>`;
}

function discardModal() {
  const p = me(), need = p.hand.length - 7, sel = app.ui.sel;

  const btn = `<button class="primary" ${sel.size === need ? '' : 'disabled'} data-k="${cb(() => send({ t: 'discard', cards: [...sel] }))}">${sel.size}/${need} kartı at</button>`;
  return sheetTop(`Elinde ${p.hand.length} kart var: ${need} kart at`, 'Sıra sonunda elinde en fazla 7 kart kalabilir. Atacağın kartlara dokun.', btn) + cardSecs(secs, sel);
}

// ---------- HAMLE GÖNDERME ----------
function send(a) {
  const s = S(); if (!s) return;
  if (app.local || app.isHost) {
    const r = applyAuth(app.mySeat, a);
    if (!r.ok) { toast(r.err); render(); }
    return;
  }
  app.ui.modal = null;
  sentAt = Date.now(); sentV = s.v; app.waitV = s.v; render();
  setTimeout(() => { if (app.waitV === sentV) { app.waitV = null; render(); } }, 8000);
  netSend(a);
  setTimeout(() => { if (S() && S().v === sentV && Date.now() - sentAt >= 7900) toast('Hamle henüz işlenmedi. Kurucunun oyun sayfası açık olmalı.'); }, 8000);
}

function applyAuth(seat, a) {
  const cur = app.local ? app.state : H.state;
  const st = clone(cur);
  const r = Engine.apply(st, seat, a);
  if (!r.ok) return r;
  try { BotLearn.record(cur, seat, a); if (st.phase === 'over' && cur.phase !== 'over') BotLearn.gameOver(st); } catch (e) {}
  if (app.local) app.state = st; else { H.state = st; app.state = st; writeGame({ state: st, status: st.phase === 'over' ? 'over' : 'playing' }); }
  render(); scheduleBots();
  return r;
}

function scheduleBots() {
  if (botTimer) return;
  const s = app.local ? app.state : H.state;
  if (!s || (!app.local && !app.isHost)) return;
  const w = Engine.whoActs(s);
  if (w < 0 || !s.players[w].bot) return;
  botTimer = setTimeout(() => {
    botTimer = null;
    const s2 = app.local ? app.state : H.state; if (!s2) return;
    const w2 = Engine.whoActs(s2); if (w2 < 0 || !s2.players[w2].bot) return;
    let r = applyAuth(w2, Bot.decide(s2, w2));
    if (!r.ok) { r = applyAuth(w2, Bot.fallback(s2, w2)); if (!r.ok) console.warn('bot takıldı', r.err); }
  }, 1200);
}

// ---------- ÇEVRİMDIŞI ----------
function startLocal() {
  try { BotLearn.reset(); } catch (e) {}
  stopOnline();
  const names = LANG === 'en' ? ['Bot Alex', 'Bot Sam', 'Bot Mia', 'Bot Leo'] : ['Bot Ayşe', 'Bot Mehmet', 'Bot Zeynep', 'Bot Can'];
  const players = [{ uid: 'me', name: (app.name || 'Ben').trim(), bot: false }, ...names.slice(0, app.botCount).map((n, i) => ({ uid: 'bot' + i, name: n, bot: true }))];
  app.local = true; app.isHost = false; app.code = null; app.game = null;
  app.state = Engine.newGame(players, { target: app.target, dupSets: app.dupSets, railBuild: app.railBuild, botLevel: 'hard' }); app.mySeat = 0; app.lastShown = -1; app.lastBld = -1; app.view = 'game'; app.ui.modal = null;
  render(); scheduleBots();
}


let noticeN = 1;
const maxOf = g => Math.min(5, Math.max(2, (g && g.maxPlayers) || 5));
function hostSetMax(n) {
  const players = H.players || app.game.players;
  if (n < players.length || n < 2 || n > 5) return;
  writeGame({ maxPlayers: n });
  app.game = { ...app.game, maxPlayers: n };
  // bekleyenler varsa (masa doluyken bağlananlar) ekle
  (H.waiting || []).slice().forEach(w => handleRemote(w.uid, { t: 'join', name: w.name }));
}
function handleRemote(uid, a) {
  if (!a || !uid) return;
  const g = app.game;
  if (a.t === 'join') {
    if (g.status !== 'lobby') return;
    const players = H.players || g.players;
    if (players.some(p => p.uid === uid)) return;
    if (players.length >= maxOf(g)) { H.waiting = [...(H.waiting || []).filter(w => w.uid !== uid), { uid, name: a.name }]; return; }
    H.waiting = (H.waiting || []).filter(w => w.uid !== uid);
    const name = String(a.name || 'Oyuncu').slice(0, 16);
    H.players = [...players, { uid, name, bot: false }];
    writeGame({ players: H.players, uids: H.players.filter(p => !p.bot).map(p => p.uid) });
    return;
  }
  if (!H.state) return;
  const seat = H.state.players.findIndex(p => p.uid === uid);
  if (seat < 0) return;
  const r = applyAuth(seat, a);
  if (!r.ok) writeGame({ notice: { uid, msg: r.err, n: noticeN++ + Date.now() } });
}

function hostAddBot() {
  const players = H.players || app.game.players;
  if (players.length >= maxOf(app.game)) return;
  const names = LANG === 'en' ? ['Bot Alex', 'Bot Sam', 'Bot Mia', 'Bot Leo'] : ['Bot Ayşe', 'Bot Mehmet', 'Bot Zeynep', 'Bot Can'];
  const used = new Set(players.map(p => p.name));
  const name = names.find(n => !used.has(n)) || 'Bot ' + players.length;
  H.players = [...players, { uid: 'bot-' + Math.random().toString(36).slice(2, 8), name, bot: true }];
  writeGame({ players: H.players });
}
function hostRemove(i) {
  const players = (H.players || app.game.players).slice(); players.splice(i, 1);
  H.players = players; writeGame({ players, uids: players.filter(p => !p.bot).map(p => p.uid) });
}
function hostStart() {
  try { BotLearn.reset(); } catch (e) {}
  const players = H.players || app.game.players;
  if (players.length < 2) return;
  H.state = clone(Engine.newGame(players, { target: app.game.target || 3, dupSets: app.game.dupSets !== false, railBuild: !!app.game.railBuild, botLevel: 'hard' })); app.state = H.state;
  writeGame({ status: 'playing', state: H.state });
  app.view = 'game'; render(); scheduleBots();
}
function hostRestart() {
  try { BotLearn.reset(); } catch (e) {}
  const players = (H.state ? H.state.players : app.game.players).map(p => ({ uid: p.uid, name: p.name, bot: p.bot }));
  H.state = clone(Engine.newGame(players, { target: (H.state && H.state.target) || app.game.target || 3, dupSets: H.state ? H.state.dupSets !== false : app.game.dupSets !== false, railBuild: H.state ? !!H.state.railBuild : !!app.game.railBuild, botLevel: 'hard' })); app.state = H.state;
  writeGame({ status: 'playing', state: H.state }); render(); scheduleBots();
}


// ---------- ONLINE (eşler arası bağlantı: sunucusuz, kurucunun tarayıcısı hakem) ----------
window.NET_MODE = 'p2p';
const PEER_PREFIX = 'tapu-takas-v1-';
const PEER_OPTS = window.PEER_OPTS || {};
let peer = null, hostConns = new Map(), clientConn = null, reconnectT = null, firstGame = true;
// Yedek yol: doğrudan bağlantı kurulamazsa (ör. aynı Wi-Fi'de modem izin vermezse) mesajlar herkese açık bir MQTT sunucusu üzerinden gider
const MQTT_URLS = window.MQTT_URLS || ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TOPIC = code => 'tapu-takas-v1/' + code;
let mq = null, mqReady = false, mqClients = new Set(), relayT = null, usingRelay = false;

function connectBroker(onReady, onMsg, i = 0) {
  if (typeof mqtt === 'undefined') return null;
  const url = MQTT_URLS[i % MQTT_URLS.length];
  let settled = false;
  const c = mqtt.connect(url, { clientId: 'tt' + Math.random().toString(36).slice(2, 12), clean: true, reconnectPeriod: 3000, connectTimeout: 7000, keepalive: 30 });
  const giveUp = setTimeout(() => { if (!settled && i + 1 < MQTT_URLS.length * 2) { settled = true; try { c.end(true); } catch (e) {} mq = connectBroker(onReady, onMsg, i + 1); } }, 8000);
  c.on('connect', () => { settled = true; clearTimeout(giveUp); mqReady = true; onReady(c); });
  c.on('close', () => { mqReady = false; });
  c.on('message', (topic, payload) => { let m; try { m = JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return; } onMsg(topic, m); });
  c.on('error', () => {});
  return c;
}
function stopRelay() { clearTimeout(relayT); try { if (mq) mq.end(true); } catch (e) {} mq = null; mqReady = false; mqClients = new Set(); usingRelay = false; }
function relayPub(topic, obj) { if (mq && mqReady) { try { mq.publish(topic, JSON.stringify(obj), { qos: 1 }); return true; } catch (e) {} } return false; }

// kurucu: yedek kanalı dinle
function startHostRelay(code) {
  mq = connectBroker(c => c.subscribe(TOPIC(code) + '/up', { qos: 1 }), (topic, m) => {
    if (!m || !m.from || !H.game || H.game.code !== code) return;
    const uid = String(m.from).slice(0, 40);
    if (m.t === 'hello') {
      mqClients.add(uid);
      if (H.game.status === 'lobby') handleRemote(uid, { t: 'join', name: m.name });
      relayPub(TOPIC(code) + '/down', { t: 'game', game: H.game });
    } else if (m.t === 'act') { mqClients.add(uid); handleRemote(uid, m.a); }
  });
}
// katılan: doğrudan bağlantı açılmazsa yedek kanala geç
function startClientRelay(code) {
  if (usingRelay || typeof mqtt === 'undefined') return false;
  usingRelay = true;
  mq = connectBroker(c => {
    c.subscribe(TOPIC(code) + '/down', { qos: 1 });
    relayPub(TOPIC(code) + '/up', { t: 'hello', from: myUid, name: app.name.trim().slice(0, 16) });
  }, (topic, m) => { if (m && m.t === 'game') { app.netStatus = 'ok'; onGame(m.game); } });
  return true;
}
myUid = lsGet('td_uid'); if (!myUid) { myUid = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); lsSet('td_uid', myUid); }

const randCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPRSTUVYZ'[Math.floor(Math.random() * 21)]).join('');
const shareLink = code => location.origin + location.pathname + '#' + code;

function netShareHTML(code) {
  const link = shareLink(code);
  const kCopy = cb(async () => { try { await navigator.clipboard.writeText(link); toast('Bağlantı kopyalandı.'); } catch (e) { const i = document.getElementById('shareLink'); if (i) { i.select(); } toast('Kopyalanamadı; bağlantıyı seçip kopyala.'); } });
  const wa = 'https://wa.me/?text=' + encodeURIComponent((LANG === 'en' ? "Let's play Deal! Join with this link: " : 'Deal oynayalım! Bu bağlantıdan katıl: ') + link);
  return `<div class="col" style="gap:8px">
    <div class="muted">Bu bağlantıyı arkadaşlarına gönder. Açıp adlarını yazınca lobiye gelirler; Claude hesabı gerekmez.</div>
    <input id="shareLink" readonly value="${esc(link)}" style="width:100%">
    <div class="row"><button class="primary" data-k="${kCopy}">Bağlantıyı kopyala</button><a class="btnlink" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp'ta paylaş</a></div></div>`;
}

// ---- son oyunlar (bu tarayıcıda) ----
function loadMyGames() {
  try { app.myGames = JSON.parse(lsGet('td_games') || '[]'); } catch (e) { app.myGames = []; }
  // 3 gündür oynanmamış oyunlar silinir, listede gösterilmez
  const STALE = 3 * 24 * 3600e3, now = Date.now();
  const old = app.myGames.filter(g => now - (g.updated || 0) > STALE);
  if (old.length) {
    old.forEach(g => { try { localStorage.removeItem('td_host_' + g.code); } catch (e) {} });
    app.myGames = app.myGames.filter(g => now - (g.updated || 0) <= STALE);
    lsSet('td_games', JSON.stringify(app.myGames));
  }
}
function rememberGame(g) {
  loadMyGames();
  const item = { code: g.code, status: g.status, players: (g.players || []).map(p => ({ name: p.name })), updated: Date.now(), hosting: g.host === myUid };
  app.myGames = [item, ...app.myGames.filter(x => x.code !== g.code)].slice(0, 6);
  lsSet('td_games', JSON.stringify(app.myGames));
}
function saveHost() { if (!H.game) return; lsSet('td_host_' + H.game.code, JSON.stringify(H.game)); rememberGame(H.game); }
function loadHost(code) { try { return JSON.parse(lsGet('td_host_' + code) || 'null'); } catch (e) { return null; } }

function stopOnline() {
  clearTimeout(reconnectT); stopRelay();
  try { if (clientConn) clientConn.close(); } catch (e) {}
  try { if (peer) peer.destroy(); } catch (e) {}
  peer = null; clientConn = null; hostConns = new Map(); firstGame = true;
  H = { state: null, ready: false, processed: new Set(), game: null, players: null };
  app.netStatus = null;
  if (botTimer) { clearTimeout(botTimer); botTimer = null; }
}
function goHome() {
  stopOnline(); app.view = 'home'; app.local = false; app.state = null; app.game = null; app.code = null; app.ui.modal = null; app.prefillCode = null;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  loadMyGames(); render();
}

function resetView(code) {
  app.local = false; app.code = code; app.ui.modal = null; app.mySeat = -1; app.lastShown = -1; app.lastBld = -1; app.waitV = null;
}

// ---------------- KURUCU ----------------
function createGame() {
  const name = app.name.trim().slice(0, 16);
  startHost({ code: randCode(), host: myUid, status: 'lobby', players: [{ uid: myUid, name, bot: false }], uids: [myUid],
    target: app.target || 3, dupSets: app.dupSets !== false, railBuild: !!app.railBuild, maxPlayers: app.maxPlayers || 3, state: null, notice: null, created: Date.now(), updated: Date.now() }, true, 0);
}

function startHost(game, fresh, tries) {
  stopOnline(); resetView(game.code);
  H.game = game; H.state = game.state ? clone(game.state) : null; H.players = clone(game.players); H.ready = true;
  app.game = H.game; app.isHost = true; app.state = H.state;
  app.mySeat = game.players.findIndex(p => p.uid === myUid);
  app.view = game.status === 'lobby' ? 'lobby' : 'game'; app.netStatus = 'connecting';
  render();
  peer = new Peer(PEER_PREFIX + game.code, PEER_OPTS);
  if (!mq) startHostRelay(game.code);
  peer.on('open', () => {
    app.netStatus = 'ok'; saveHost();
    try { history.replaceState(null, '', '#' + game.code); } catch (e) {}
    render(); scheduleBots();
  });
  peer.on('connection', conn => {
    conn.on('data', msg => onHostData(conn, msg));
    conn.on('close', () => { if (hostConns.get(conn.peer) === conn) hostConns.delete(conn.peer); });
    conn.on('error', () => {});
  });
  peer.on('disconnected', () => { try { if (peer && !peer.destroyed) peer.reconnect(); } catch (e) {} });
  peer.on('error', err => {
    const t = err && err.type;
    if (t === 'unavailable-id') {
      if (fresh && tries < 5) { game.code = randCode(); stopRelay(); return startHost(game, true, tries + 1); }
      if (tries < 12) { app.netStatus = 'down'; render(); setTimeout(() => { if (app.code === game.code && app.isHost) startHost(game, false, tries + 1); }, 3000); return; }
      toast('Bu oyun başka bir sekmede açık görünüyor.');
      return;
    }
    if (t === 'peer-unavailable') return;
    if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(t)) { app.netStatus = 'down'; render(); }
  });
}

function onHostData(conn, msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'hello') {
    conn.uid = String(msg.uid || '').slice(0, 40);
    hostConns.set(conn.peer, conn);
    if (H.game.status === 'lobby') handleRemote(conn.uid, { t: 'join', name: msg.name });
    try { conn.send({ t: 'game', game: H.game }); } catch (e) {}
    return;
  }
  if (msg.t === 'act' && conn.uid) handleRemote(conn.uid, msg.a);
}

function writeGame(patch) {
  H.game = { ...H.game, ...patch, updated: Date.now() };
  app.game = H.game;
  saveHost();
  hostConns.forEach(c => { try { if (c.open) c.send({ t: 'game', game: H.game }); } catch (e) {} });
  if (mqClients.size) relayPub(TOPIC(H.game.code) + '/down', { t: 'game', game: H.game });
  render();
}

// ---------------- KATILAN ----------------
function joinByCode(raw) {
  const code = String(raw || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) return toast('4 harfli oyun kodunu yaz.');
  if (!app.name.trim()) return toast('Önce adını yaz.');
  openGame(code);
}
function openGame(code) {
  const saved = loadHost(code);
  if (saved && saved.host === myUid) return startHost(saved, false, 0);
  startClient(code);
}

function startClient(code) {
  stopOnline(); resetView(code);
  app.game = null; app.state = null; app.isHost = false; app.view = 'lobby'; app.netStatus = 'connecting';
  render();
  peer = new Peer(PEER_OPTS);
  peer.on('open', () => connectHost());
  peer.on('disconnected', () => { try { if (peer && !peer.destroyed) peer.reconnect(); } catch (e) {} });
  peer.on('error', err => {
    const t = err && err.type;
    if (t === 'peer-unavailable') {
      if (!app.game && !usingRelay) { toast('Bu kodla açık bir oyun bulunamadı. Oyunu kuranın sayfası açık olmalı.'); goHome(); }
      else if (!usingRelay) { app.netStatus = 'down'; render(); scheduleReconnect(); }
      return;
    }
    if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(t)) { if (!usingRelay) { startClientRelay(app.code); } else { app.netStatus = 'down'; render(); } }
  });
  // doğrudan bağlantı 6 sn'de kurulmazsa yedek kanalı da aç
  relayT = setTimeout(() => { if (!(clientConn && clientConn.open)) startClientRelay(code); }, window.FORCE_RELAY ? 0 : 6000);
}

function connectHost() {
  if (!peer || peer.destroyed) return;
  if (window.FORCE_RELAY) return;
  const conn = peer.connect(PEER_PREFIX + app.code, { reliable: true });
  clientConn = conn;
  const t = setTimeout(() => { if (clientConn === conn && !conn.open) { try { conn.close(); } catch (e) {} if (usingRelay && app.game) return; if (app.game) scheduleReconnect(); else if (usingRelay) { setTimeout(() => { if (!app.game && app.code) { toast('Oyuna bağlanılamadı. Kod doğru mu, kurucunun sayfası açık mı?'); goHome(); } }, 8000); } else { toast('Oyuna bağlanılamadı. Kod doğru mu, kurucunun sayfası açık mı?'); goHome(); } } }, window.FORCE_RELAY ? 1 : 12000);
  conn.on('open', () => { clearTimeout(t); app.netStatus = 'ok'; conn.send({ t: 'hello', uid: myUid, name: app.name.trim().slice(0, 16) }); render(); });
  conn.on('data', msg => { if (msg && msg.t === 'game') onGame(msg.game); });
  conn.on('close', () => { if (clientConn === conn) { if (usingRelay && mqReady) return; app.netStatus = 'down'; render(); scheduleReconnect(); startClientRelay(app.code); } });
  conn.on('error', () => {});
}
function scheduleReconnect() {
  clearTimeout(reconnectT);
  if (usingRelay && mqReady) return;
  reconnectT = setTimeout(() => {
    if (!peer || peer.destroyed || app.isHost || !app.code) return;
    if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
    connectHost();
  }, 3000);
}

function onGame(g) {
  if (!g || g.code !== app.code) return;
  app.game = g;
  app.mySeat = (g.players || []).findIndex(p => p.uid === myUid);
  app.state = g.state;
  if (g.notice && g.notice.uid === myUid && g.notice.n !== lastNoticeN) { if (!firstGame) { toast(g.notice.msg); app.waitV = null; } lastNoticeN = g.notice.n; }
  firstGame = false;
  app.view = g.status === 'lobby' ? 'lobby' : 'game';
  rememberGame(g);
  try { history.replaceState(null, '', '#' + g.code); } catch (e) {}
  render();
}

function netSend(a) {
  if (clientConn && clientConn.open) { try { clientConn.send({ t: 'act', a: clone(a) }); return; } catch (e) {} }
  if (usingRelay && relayPub(TOPIC(app.code) + '/up', { t: 'act', from: myUid, a: clone(a) })) return;
  app.waitV = null; render();
  toast('Bağlantı yok; yeniden bağlanılıyor, birazdan tekrar dene.');
}

// ---------- başlangıç ----------
(function init() {
  app.canWrite = true;
  app.onlineStatus = typeof Peer === 'undefined' ? 'off' : 'ready';
  loadMyGames();
  const h = (location.hash || '').slice(1).toUpperCase();
  if (/^[A-Z]{4}$/.test(h)) {
    const saved = loadHost(h);
    if (saved && saved.host === myUid && app.onlineStatus === 'ready') { render(); startHost(saved, false, 0); return; }
    app.prefillCode = h;
  }
  render();
})();

</script></body></html>
