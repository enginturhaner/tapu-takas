<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Deal">
<title>Deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/mqtt@5.15.0/dist/mqtt.min.js"></script>
<style>
:root{
  /* Yeşil çuha masa: tek tema. Düzen: üstte rakipler, ortada senin masan + kayıt, altta elin */
  --felt:#0e3a2d; --felt-2:#145040; --felt-3:#1b6450;
  --ink:#f2efe4; --muted:#a9c2b6; --gold:#efbf4a; --danger:#ff7a6b;
  --paper:#fbf8ef; --paper-ink:#1d1d1b;
  --display:'Archivo Black', 'Arial Black', system-ui, sans-serif;
  --body:'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
#app{height:100%}
body{background:radial-gradient(ellipse at 50% 35%, var(--felt-3) 0%, var(--felt-2) 35%, var(--felt) 80%), var(--felt);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35}
button{font-family:inherit;font-size:14px;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--felt-3);color:var(--ink);font-weight:600}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--gold);color:#2b2100}
button.danger{background:#b5382b}
button.ghost{background:transparent;border:1px solid rgba(255,255,255,.25)}
button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font-family:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}

/* ---------- ana sayfa ---------- */
.home{max-width:980px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand h1{font-size:44px;line-height:1;color:var(--gold)}
.brand p{margin:0;color:var(--muted);max-width:52ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:20px}
.list{display:flex;flex-direction:column;gap:6px}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.05);border-radius:10px}
.code{font-family:var(--display);letter-spacing:.12em}
.rules{font-size:14px;color:var(--muted)}
.rules li{margin:3px 0}
.rules b{color:var(--ink)}
.notice{background:rgba(239,191,74,.12);border:1px solid rgba(239,191,74,.4);border-radius:12px;padding:10px 12px;font-size:14px}

/* ---------- lobi ---------- */
.lobby{max-width:620px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:16px}
.bigcode{font-family:var(--display);font-size:56px;letter-spacing:.18em;color:var(--gold);line-height:1}

/* ---------- oyun masası ---------- */
.game{height:100%;box-shadow:inset 0 0 0 10px #4a2c17, inset 0 0 0 12px #2b190c, inset 0 0 60px rgba(0,0,0,.5);padding:18px !important;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:8px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 8px}
.topbar .turn{font-weight:700}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}
.dots i.on{background:var(--gold)}
.spacer{flex:1}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:600;white-space:nowrap}
.pill.gold{background:var(--gold);color:#2b2100}
.pill.bot{background:#3d5f9a}

.opps{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.opp{flex:1 0 260px;max-width:520px;background:rgba(0,0,0,.2);border-radius:14px;padding:8px 10px;border:2px solid transparent;display:flex;flex-direction:column;gap:6px}
.opp.active{border-color:var(--gold)}
.opp .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opp .name{font-weight:700}
.stacks{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}

.mid{display:grid;grid-template-columns:1fr 330px;gap:8px;min-height:0;overflow:hidden}
.side{display:flex;flex-direction:column;gap:8px;min-height:0}
@media (max-width:820px){.game{height:auto;min-height:100%}.mid{overflow:visible}}
@media (max-width:820px){.mid{grid-template-columns:1fr}.logbox{max-height:140px}}
.mine{background:rgba(0,0,0,.16);border-radius:14px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:10px;border:2px solid transparent}
.mine.active{border-color:var(--gold)}
.mine .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bankrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#e8f2dc;color:#1c3a14;font-variant-numeric:tabular-nums}
.logbox{flex:1;background:rgba(0,0,0,.25);border-radius:14px;padding:10px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:4px;min-height:0}
.logbox div{color:var(--muted)}
.logbox div:first-child{color:var(--ink);font-weight:600}
.status{background:var(--gold);color:#2b2100;border-radius:12px;padding:8px 12px;font-weight:700}
.status.wait{background:rgba(255,255,255,.12);color:var(--ink)}

.handbar{background:rgba(0,0,0,.28);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.hand{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px}

/* ---------- kartlar ---------- */
.card{--w:100px;width:var(--w);height:calc(var(--w)*1.42);flex:0 0 auto;border-radius:calc(var(--w)*.08);background:#fffdf7;color:var(--paper-ink);position:relative;user-select:none;
  box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);font-size:calc(var(--w)*.105);padding:calc(var(--w)*.045);line-height:1.1}
.card .inner{position:relative;height:100%;border-radius:calc(var(--w)*.05);overflow:hidden;display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.18)}
.card.click{cursor:pointer;transition:transform .14s, box-shadow .14s}
.card.click:hover{transform:translateY(-6px);box-shadow:0 10px 18px rgba(0,0,0,.45)}
.card.sel{outline:4px solid var(--gold);outline-offset:1px;transform:translateY(-8px)}
.card.md{--w:74px}
.card.sm{--w:58px}
.card.xs{--w:30px;padding:2px}
.card .cv{position:absolute;top:calc(var(--w)*.025);left:calc(var(--w)*.025);z-index:4;min-width:2.3em;height:2.3em;padding:0 .2em;border-radius:99px;background:#fff;color:#1d1d1b;border:.14em solid #1d1d1b;font-size:.72em;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

/* tapu */
.card.prop .ptitle{background:var(--c);color:var(--k);text-align:center;padding:.55em .3em .5em 1.4em;display:flex;flex-direction:column;gap:.15em;min-height:34%;justify-content:center}
.card.prop .ptitle small{font-size:.5em;letter-spacing:.14em;opacity:.85;font-weight:700}
.card.prop .ptitle b{font-size:.95em;font-weight:800;text-wrap:balance}
.card .ladder{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.28em;padding:.3em .55em}
.card .lr{display:flex;align-items:center;justify-content:space-between;font-size:.82em;font-variant-numeric:tabular-nums}
.card .pips{display:flex;gap:.15em}
.card .pips i{width:.55em;height:.75em;border-radius:.1em;background:var(--c);border:1px solid rgba(0,0,0,.35)}
.card .full{font-size:.58em;color:#666;text-align:center;font-style:italic;margin-top:.1em}

/* para: banknot */
.card.money{background:#fffdf7}
.card.money .inner{background:radial-gradient(circle at 50% 52%, color-mix(in srgb, var(--m) 55%, #fff) 0 30%, var(--m) 70%);align-items:center;justify-content:space-between;padding:.55em .3em .5em;border:.16em solid var(--d);color:var(--d)}
.card.money .guil{position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:repeating-radial-gradient(circle at 0 0, transparent 0 .55em, color-mix(in srgb, var(--d) 18%, transparent) .55em .62em),
             repeating-radial-gradient(circle at 100% 100%, transparent 0 .55em, color-mix(in srgb, var(--d) 18%, transparent) .55em .62em)}
.card.money .inner::after{content:'';position:absolute;inset:.28em;border:1px solid color-mix(in srgb, var(--d) 55%, transparent);border-radius:.35em;pointer-events:none}
.card.money .mc{position:absolute;font-family:var(--display);font-size:.95em;line-height:1;color:var(--d);z-index:2}
.card.money .mc.tl{top:.45em;left:.5em}.card.money .mc.tr{top:.45em;right:.5em}
.card.money .mc.bl{bottom:.45em;left:.5em;transform:rotate(180deg)}.card.money .mc.br{bottom:.45em;right:.5em;transform:rotate(180deg)}
.card.money .mtop{position:relative;z-index:2;font-size:.46em;font-weight:800;letter-spacing:.14em;text-align:center;line-height:1.2;margin-top:.3em}
.card.money .medal{position:relative;z-index:2;width:70%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.card.money .rose{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(var(--d) 0 5deg, color-mix(in srgb, var(--d) 30%, #fff) 5deg 10deg);
  -webkit-mask:radial-gradient(circle, transparent 0 58%, #000 59% 100%);mask:radial-gradient(circle, transparent 0 58%, #000 59% 100%)}
.card.money .face{position:relative;width:72%;aspect-ratio:1;border-radius:50%;background:#fffdf3;border:.12em solid var(--d);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .18em var(--m)}
.card.money .face b{font-family:var(--display);font-size:1.9em;line-height:.95;color:var(--d)}
.card.money .face small{font-size:.42em;font-weight:800;letter-spacing:.12em}
.card.money .mword{position:relative;z-index:2;font-size:.5em;font-weight:800;letter-spacing:.1em;background:var(--d);color:#fffdf3;padding:.18em .55em;border-radius:99px;margin-bottom:.35em}
.card.sm.money .mtop,.card.sm.money .mword,.card.sm.money .mc.tr,.card.sm.money .mc.bl{display:none}
.card.sm.money .inner{justify-content:center}
.card.sm.money .medal{width:86%}
.card.md.money .mtop{font-size:.42em}
.card.xs.money .inner > *:not(.medal){display:none}

.bankrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.bankpile{position:relative;flex:0 0 auto}
.bankpile .cnt{position:absolute;right:-6px;top:-8px;z-index:9;background:#1d1d1b;color:#fff;font-size:11px;font-weight:800;padding:2px 6px;border-radius:99px;border:1.5px solid var(--gold)}
.bankpile .bv{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);z-index:9;white-space:nowrap;background:#fffdf3;color:#1d1d1b;border:1.5px solid #1d1d1b;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px}
.bankrow{padding-bottom:6px}
.notes{display:flex;gap:4px;flex-wrap:wrap}
.note{font-size:11px;font-weight:800;padding:3px 7px;border-radius:4px;background:var(--m);color:var(--d);border:1.5px solid var(--d);font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.bldfly .cap{background:#a5341a}

/* hamle */
.card.act .inner,.card.rent .inner{background:var(--m,#fbefd6);align-items:center;padding:.3em .3em}
.card.rent .inner{background:#f7f2e4}
.card .hdr{font-size:.5em;letter-spacing:.16em;font-weight:800;color:#6b2a12;margin-top:1.9em}
.card .disc{margin:.35em 0 .3em;width:74%;aspect-ratio:1;border-radius:50%;background:#fffdf5;border:.18em solid #a5341a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.3em}
.card .disc span{font-family:var(--display);font-size:.78em;line-height:1.02;color:#a5341a;text-wrap:balance}
.card .disc .ico{width:42%;color:#a5341a}
.card .disc .ico svg{width:100%;height:auto;display:block}
.card.rent .disc{border:.18em solid #1d1d1b;position:relative}
.card.rent .disc span{background:#fffdf5;border-radius:50%;width:62%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#1d1d1b;font-size:.85em}
.card .desc{font-size:.56em;text-align:center;color:#3a3326;padding:0 .3em;line-height:1.15}

/* joker: iki renkli */
.card.wild2 .inner{background:#fffdf7}
.card.wild2 .half{flex:1;background:var(--c);color:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;padding:.3em}
.card.wild2 .half b{font-size:.95em;font-weight:800}
.card.wild2 .half .mini{font-size:.6em;opacity:.92;font-variant-numeric:tabular-nums}
.card.wild2 .half.bot{transform:rotate(180deg)}
.card.wild2 .ribbon{height:1.55em;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#1d1d1b 0 .35em,#2f2f2c .35em .7em);color:#ffd85a;font-size:.6em;font-weight:800;letter-spacing:.12em;border-top:2px solid #ffd85a;border-bottom:2px solid #ffd85a}
.card.wild2 .ribbon span{white-space:nowrap}
.card.wild2.flip .inner{transform:rotate(180deg)}
.card.wild2.placed .half.bot{filter:saturate(.45) brightness(.92)}
.card.wild2.flip.placed .half.bot{filter:none}
.card.wild2.flip.placed .half.top{filter:saturate(.45) brightness(.92)}
.card.wild2.placed{box-shadow:0 0 0 2px #ffd85a,0 3px 8px rgba(0,0,0,.35)}

/* joker: renkli */
.card.wildany{background:linear-gradient(#fffdf7,#fffdf7) padding-box, conic-gradient(#e0322f,#f28c28,#f6d22a,#1e9d4b,#8fd0f0,#203f9a,#d6429b,#e0322f) border-box;border:calc(var(--w)*.04) solid transparent}
.card.wildany .inner{align-items:center;justify-content:center;gap:.35em;background:#1d1d1b;color:#fff}
.card.wildany .jtag{font-family:var(--display);font-size:.9em;letter-spacing:.14em;color:#ffd85a}
.card.wildany .ring{width:66%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:14%}
.card.wildany .ring span{background:#1d1d1b;border-radius:50%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.62em;line-height:1.05}
.card.wildany .jcap{font-size:.55em;text-align:center;padding:0 .4em;color:#ddd}
.card.wildany .placedbar{position:absolute;left:0;right:0;top:0;text-align:center;font-size:.7em;font-weight:800;padding:.25em;border-radius:calc(var(--w)*.06) calc(var(--w)*.06) 0 0}

/* arka yüz */
.card.back .inner{background:repeating-linear-gradient(45deg,#8c1f1f 0 5px,#a32b2b 5px 10px);align-items:center;justify-content:center;border:2px solid #f3d9a8}
.card.back .inner span{font-family:var(--display);color:#f8e7c2;font-size:.85em;text-align:center;line-height:1.05;background:#7a1717;padding:.3em .4em;border-radius:.3em;border:1px solid #f3d9a8}
.card.xs.back .inner span{display:none}

/* küçük boyutlar */
.card.sm .ladder,.card.sm .desc,.card.sm .hdr,.card.sm .jcap,.card.sm .mini,.card.sm .ptitle small{display:none}
.card.sm .ptitle{min-height:46%;padding:.3em .15em;font-size:1.25em}
.card.sm .ptitle b{font-weight:700}
.card.sm.prop .ptitle{flex:1}
.card.sm .cv{display:none}
.card.sm .disc{width:86%;margin-top:.8em}
.card.sm .disc .ico{display:none}
.card.sm .disc span{font-size:.85em}
.card.sm.wild2 .half b{font-size:1em}
.card.sm.wild2 .ribbon span{display:none}
.card.md .desc{font-size:.52em}
.card.md .full{display:none}

.fan{display:flex}
.fan .card{margin-left:-20px}
.fan .card:first-child{margin-left:0}

.stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.stack .pile{position:relative}
.stack.done .pile::after{content:'TAM SET';position:absolute;right:-8px;top:-9px;background:var(--gold);color:#2b2100;font-size:9px;font-weight:800;padding:2px 5px;border-radius:6px;z-index:20;letter-spacing:.05em}
.stack .bld{display:flex;gap:3px}
.stack .bld span{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;background:#fffdf5;color:#a5341a}
.stack.pick{cursor:pointer}
.stack.pick:hover .pile{filter:brightness(1.1)}
.stack .lbl{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* masa ortası */
.center{display:flex;gap:14px;align-items:flex-end;justify-content:center;padding:10px;background:rgba(0,0,0,.18);border-radius:14px;border:1px dashed rgba(255,255,255,.14)}
.pilebox{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.deckpile{position:relative;width:74px;height:105px}
.deckpile .card{position:absolute;left:0}
.discpile{position:relative;width:74px;height:105px;border-radius:8px;border:2px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.discpile .card{position:absolute;left:0;top:0}
.lastplay{flex:1;min-width:0;font-size:13px;color:var(--ink);align-self:center}
.lastplay b{color:var(--gold)}

/* yere atılan kart animasyonu */
.flyin{position:fixed;left:50%;top:45%;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;animation:fly 2s cubic-bezier(.2,.8,.2,1) forwards}
.flyin .card{--w:150px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.flyin .cap{background:#1d1d1b;color:#fff;padding:7px 14px;border-radius:99px;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.4)}
@keyframes fly{
  0%{opacity:0;transform:translate(-50%,calc(-50% + var(--dy))) scale(.45) rotate(var(--rot))}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(0deg)}
  30%{transform:translate(-50%,-50%) scale(1)}
  78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + 30vw),-50%) scale(.45)}
}

/* ---------- pencere ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#123f32;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:18px;max-width:640px;width:100%;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal h3{font-size:20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opts button small{font-weight:400;color:var(--muted)}
.opts button.primary small{color:#4a3a00}
.pickgrid{display:flex;gap:8px;flex-wrap:wrap}
.who{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.win{font-family:var(--display);font-size:36px;color:var(--gold);text-align:center}
@media (prefers-reduced-motion: reduce){.flyin{animation:fadefly 2s forwards}@keyframes fadefly{0%,80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}.card.click{transition:none}.card.click:hover,.card.sel{transform:none}}

/* ---------- kompakt tapu grupları (batak gibi yelpaze) ---------- */
.card.ts{--w:46px;padding:2px}
.card.tl{--w:66px;padding:3px}
.card.ts .ladder,.card.ts .desc,.card.ts .hdr,.card.ts .jcap,.card.ts .mini,.card.ts .ptitle small,.card.ts .ribbon span,
.card.tl .ladder,.card.tl .desc,.card.tl .hdr,.card.tl .jcap,.card.tl .mini,.card.tl .ptitle small,.card.tl .ribbon span{display:none}

// ===== OYUN MOTORU: Monopoly Deal kuralları (+ ev kuralı: yerdeki tapuyu başka renge taşımak 1 hamle) =====

    .forEach(([colors]) => add({ k: 'rent', colors, v: 1, name: 'Kira' }, 2));
  add({ k: 'rent', colors: 'any', v: 3, name: 'Joker Kira' }, 3);
  // toplam 106 kart

  const C = id => CARDS[id];

  const err = m => ({ ok: false, err: m });
  const OK = { ok: true };

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function newGame(players, opts = {}) {
    const s = {
      players: players.map(p => ({ uid: p.uid, name: p.name, bot: !!p.bot, hand: [], bank: [], stacks: [] })),
      deck: shuffle(CARDS.map(c => c.id)), discard: [], turn: Math.floor(Math.random() * players.length),

  function draw(s, p, n) {

  function rentFor(p, color) {

      if (st.color !== color) return;

      if (!real) return; // sadece renkli joker ile kira istenemez
      const sz = COLORS[color].size;

      best = Math.max(best, r);

  }

  function completeColors(p) { return new Set(p.stacks.filter(complete).map(st => st.color)); }
  // ev kuralı: aynı renkten ikinci tam set de sayılır (s.dupSets); resmi kural: sadece farklı renkler
  function countSets(p, s) { return (s && s.dupSets === false) ? completeColors(p).size : p.stacks.filter(complete).length; }

  function findOnTable(p, id) {
    for (const st of p.stacks) {
      if (st.cards.includes(id)) return { st, kind: 'card' };
      if (st.house === id) return { st, kind: 'house' };
      if (st.hotel === id) return { st, kind: 'hotel' };

  // Başkasından gelen joker: alıcının en çok kartı olan uygun renginde başlar (eşitlikte eski rengi korur)

    let best = cur, bs = [open(cur), all(cur)];
    opts.forEach(col => { const sc = [open(col), all(col)]; if (sc[0] > bs[0] || (sc[0] === bs[0] && sc[1] > bs[1])) { best = col; bs = sc; } });
    return best;
  }

  function placeProp(s, p, id, color) {
    const sz = COLORS[color].size;
    let target = null;
    p.stacks.forEach(st => { if (st.color === color && st.cards.length < sz && (!target || st.cards.length > target.cards.length)) target = st; });
    if (!target) { target = { sid: s.sid++, color, cards: [], house: null, hotel: null }; p.stacks.push(target); }

  // Masadan kart kaldır; set bozulursa ev/otel sahibinin bankasına PARA olarak geçer
  function bldToBank(s, p, ids) {
    if (!ids.length) return;
    ids.forEach(id => p.bank.push(id));

    const total = ids.reduce((x, id) => x + C(id).v, 0);

  }

  function refill(s, p, st) {

    let guard = 0;

      if (!donors.length) break;

  }

  const tableIds = p => p.stacks.flatMap(st => [...st.cards, ...(st.house != null ? [st.house] : []), ...(st.hotel != null ? [st.hotel] : [])]);
  const assetIds = p => [...p.bank, ...tableIds(p)];
  const assetTotal = p => assetIds(p).reduce((a, id) => a + C(id).v, 0);
  const colorOnTable = (p, id) => { const f = findOnTable(p, id); return f ? f.st.color : null; };

  // ev kuralı: hamle hakkı varken elde 7'den fazla kart varsa sıra bitirilemez

  function endTurn(s) {

  function respondent(s) {

  }

  function whoActs(s) {

    if (s.pending) return respondent(s);
    return s.turn;
  }

  // hiçbir seçeneği olmayan yanıtları otomatik geç
  function autoSettle(s) {
    let guard = 0;
    if (checkWin(s)) return;
    while (s.pending && guard++ < 20) {
      const pd = s.pending;

        if (!s.players[pd.actor].hand.some(id => isAct(id, 'jsn'))) { log(s, `${pname(s, pd.actor)} karşılık veremedi, hamle iptal.`); advance(s); continue; }
        break;
      }
      const t = s.players[pd.cur];
      const hasJsn = t.hand.some(id => isAct(id, 'jsn'));
      if (pd.kind === 'pay' && assetTotal(t) === 0) { log(s, `${t.name} ödeyecek bir şeyi yok.`); advance(s); continue; }

  function apply(s, seat, a) {

    if (s.phase === 'over') return err('Oyun bitti.');
    const r = s.pending ? respond(s, seat, a) : act(s, seat, a);
    if (r.ok) s.v = (s.v || 0) + 1;
    return r;
  }

  function act(s, seat, a) {
    if (seat !== s.turn) return err('Sıra sende değil.');
    const p = s.players[seat];
    if (s.phase === 'discard') {
      if (a.t !== 'discard') return err('Önce fazla kartları atmalısın.');
      const need = p.hand.length - 7;
      const ids = [...new Set(a.cards || [])];
      if (ids.length !== need || !ids.every(id => p.hand.includes(id))) return err(`Tam ${need} kart seçmelisin.`);
      ids.forEach(id => { takeFromHand(p, id); s.discard.push(id); });
      log(s, `${p.name} ${need} kart attı.`);
      nextTurn(s); return OK;
    }
    if (a.t === 'end') {
      if (s.playsLeft > 0 && p.hand.length > 7) return err(`Elinde ${p.hand.length} kart var. 7'den fazla kartın varken sıranı bitiremezsin: önce kalan ${s.playsLeft} hamleni yap.`);
      log(s, `${p.name} sırasını bitirdi.`); endTurn(s); return OK;
    }

    if (a.t === 'move') {

      if (!COLORS[a.color] || !wildOk(id, a.color) || f.st.color === a.color) return err('Bu renge taşınamaz.');
      const cost = complete(f.st) ? 1 : 0; // ev kuralı: sadece TAM seti bozmak 1 hamle; tam olmayan gruptan joker almak ücretsiz
      if (s.playsLeft < cost) return err('Seti bozmak 1 hamle ister; hamle hakkın kalmadı.');
      const from = f.st.color;
      removeFromTable(s, p, id); placeProp(s, p, id, a.color);
      s.playsLeft -= cost;
      log(s, `${p.name} joker tapuyu ${COLORS[from].n} → ${COLORS[a.color].n} taşıdı${cost ? ' (1 hamle)' : ' (ücretsiz)'}.`);
      setLast(s, seat, id, 'move', a.color);
      afterPlay(s); return OK;
    }

    const id = a.card;
    if (!p.hand.includes(id)) return err('Bu kart elinde değil.');
    const c = C(id);
    if (s.playsLeft < 1) return err('Hamle hakkın kalmadı.');

    if (a.t === 'bank') {
      if (c.k === 'prop' || c.k === 'wild') return err('Tapular bankaya konamaz.');
      takeFromHand(p, id); p.bank.push(id); s.playsLeft--;
      setLast(s, seat, id, 'bank'); log(s, `${p.name} bankaya ${c.v}M koydu${c.k !== 'money' ? ` (${c.name})` : ''}.`);
      afterPlay(s); return OK;
    }
    if (a.t === 'prop') {
      if (c.k !== 'prop' && c.k !== 'wild') return err('Bu kart tapu değil.');
      const color = c.k === 'prop' ? c.color : a.color;
      if (!COLORS[color] || !wildOk(id, color)) return err('Renk seç.');
      takeFromHand(p, id); placeProp(s, p, id, color); s.playsLeft--;
      setLast(s, seat, id, 'prop', color); log(s, `${p.name} tapu açtı: ${c.k === 'prop' ? c.name : c.name + ' → ' + COLORS[color].n}.`);
      afterPlay(s); return OK;
    }
    if (c.k === 'act') {
      const target = a.target;
      const validTarget = () => Number.isInteger(target) && target >= 0 && target < s.players.length && target !== seat;
      switch (c.a) {
        case 'passgo':
          takeFromHand(p, id); s.discard.push(id); s.playsLeft--;
          setLast(s, seat, id, 'act'); draw(s, p, 2); log(s, `${p.name} Tekrar Çek oynadı, 2 kart çekti.`);
          afterPlay(s); return OK;
        case 'house': case 'hotel': {

    if (n >= size) return 0; // tam setler ayrı sayılır

    const dupPenalty = (s.dupSets === false && doneColors.has(st.color)) ? 0.2 : 1;
    const frac = n / size;
    return (real ? 1 : 0.6) * Math.pow(frac, TUNE.partExp) * TUNE.partW * w * dupPenalty * (size - n === 1 ? 1.25 : 1);
  }
  function posScore(s, p, isMe) {
    const target = s.target || 3;
    const doneStacks = p.stacks.filter(complete);
    const doneColors = new Set(doneStacks.map(st => st.color));
    const done = E.countSets(p, s);
    let sc = done * TUNE.set + (done >= target - 1 ? TUNE.near : 0);
    // en iyi yarım grup (renk başına)
    const bestPartial = {};
    p.stacks.forEach(st => { if (complete(st)) return; const v = stackValue(s, st, doneColors); bestPartial[st.color] = Math.max(bestPartial[st.color] || 0, v); });
    const partials = Object.values(bestPartial).sort((a, b) => b - a);
    const pw = isMe ? 1 : TUNE.oppPartial;
    partials.forEach((v, i) => { sc += pw * v * (i < target - done ? 1 : 0.35); });
    // kira gücü
    doneStacks.forEach(st => { const col = COLORS[st.color]; sc += (col.rent[col.size - 1] + (st.house != null ? 3 : 0) + (st.hotel != null ? 4 : 0)) * TUNE.rentW; });
    // banka
    const bank = p.bank.reduce((x, id) => x + C(id).v, 0);
    sc += Math.min(bank, 12) * TUNE.bankW + Math.max(0, Math.min(bank, 25) - 12) * 1.5 + Math.max(0, bank - 25) * 0.5;
    // Engin'in kuralı: oyun başında küçük paraları bankaya koy ki tapular ödemede boşa gitmesin.
    // Bankadaki kart adedi (bozuk para) ve ilk birkaç milyon ekstra değerli; masada tapu varken banka boşsa risk.
    const money = p.bank.filter(id => C(id).k === 'money'), nBank = money.length, small = money.filter(id => C(id).v <= 2).length;
    sc += TUNE.cushN * Math.min(nBank, 4) + TUNE.cushS * Math.min(small, 3) + TUNE.cushM * Math.min(bank, 6);
    const exposed = p.stacks.filter(st => !complete(st)).reduce((x, st) => x + st.cards.length, 0);
    if (isMe) sc -= TUNE.risk * exposed * Math.max(0, 5 - bank);
    // el
    if (isMe) sc += p.hand.reduce((x, id) => x + handCardValue(s, p, id), 0);
    return sc;
  }
  function evalFor(s, seat) {
    if (s.phase === 'over') return s.winner === seat ? 1e6 : -1e6;
    const my = posScore(s, s.players[seat], true);
    let mx = 0, sum = 0;
    const target = s.target || 3;
    s.players.forEach((p, i) => {
      if (i === seat) return;
      let v = posScore(s, p, false);
      // kazanmaya bir set kalan rakip: herkes ona yüklenir (setlerini Haciz'le al, tapularını çal, kirayı ondan iste)
      const d = E.countSets(p, s);
      if (d >= target - 1) v = v * TUNE.leadMul + TUNE.leadAdd * d;
      mx = Math.max(mx, v); sum += v;
    });
    return my - TUNE.wmax * mx - TUNE.wsum * sum;
  }

  // ---------- simülasyon ----------
  function shuffleDeck(st) { const a = st.deck; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
  // bekleyen yanıtları çöz: rakipler Reddet kullanmadan en iyi şekilde öder/kabul eder
  function resolve(st, seat) {
    let guard = 0;
    while (st.pending && st.phase !== 'over' && guard++ < 12) {
      const w = E.respondent(st), pd = st.pending;
      let a;
      if (pd.stage === 'actor') a = { t: 'accept' };
      else if (pd.kind === 'steal') a = { t: 'accept' };
      else a = { t: 'pay', cards: payChoice(st, w, pd.amount, pd.actor) };
      const r = E.apply(st, w, a);
      if (!r.ok) { const r2 = E.apply(st, w, { t: 'pay', cards: assetIds(st.players[w]).filter(id => C(id).v > 0) }); if (!r2.ok) break; }
    }
  }
  function simulate(s, seat, a) {
    const st = cloneS(s); shuffleDeck(st);
    const r = E.apply(st, seat, a);
    if (!r.ok) return null;
    resolve(st, seat);
    return st;
  }

  // ---------- aday hamleler ----------
  function candidates(s, seat) {
    const p = s.players[seat], out = [], lone = [];
    const opp = others(s, seat);
    const dbls = p.hand.filter(id => isAct(id, 'double'));
    const seen = new Set();
    // joker taşıma (set bozma dahil)
    p.stacks.forEach(st => st.cards.forEach(id => {
      if (C(id).k !== 'wild') return;
      const cols = C(id).colors === 'any' ? CK : C(id).colors;
      cols.forEach(col => {
        if (col === st.color) return;
        // joker tek başına yeni bir gruba taşınmaz; yalnızca gerçek tapulu ya da tamamlanacak gruba
        const ok = p.stacks.some(x => x.color === col && !complete(x) && x.cards.length + 1 >= COLORS[col].size);
        if (ok) out.push({ t: 'move', card: id, color: col });
      });
    }));
    if (s.playsLeft <= 0) return out;
    p.hand.forEach(id => {
      const c = C(id);
      const key = c.k === 'money' ? 'm' + c.v : c.k === 'act' ? 'a' + c.a : c.k === 'rent' ? 'r' + JSON.stringify(c.colors) : 'p' + id;
      if (seen.has(key)) return; seen.add(key);
      // Engin'in kuralı: Haciz ve Reddet asla para olarak bankaya konmaz (yalnızca 7+ kartla başka çare yoksa)
      if (c.k !== 'prop' && c.k !== 'wild') ((c.k === 'act' && (c.a === 'dealbreaker' || c.a === 'jsn')) ? lone : out).push({ t: 'bank', card: id });
      if (c.k === 'prop') out.push({ t: 'prop', card: id });
      if (c.k === 'wild') (c.colors === 'any' ? CK : c.colors).forEach(col => {
        // kural: joker asla tek başına açılmaz (rakip Tapu Devri ile hemen alır). Yalnızca içinde gerçek tapu olan gruba ya da seti tamamlayacaksa.
        const size = COLORS[col].size;
        // Engin'in kuralı: joker yalnızca seti TAMAMLAYACAKSA açılır (yarım sette Tapu Devri ile kolayca alınır)
        const ok = p.stacks.some(st => st.color === col && !complete(st) && st.cards.length + 1 >= size);
        (ok ? out : lone).push({ t: 'prop', card: id, color: col });
      });
      if (c.k === 'rent') {
        const cols = (c.colors === 'any' ? CK : c.colors).filter(col => E.rentFor(p, col) > 0);
        cols.forEach(col => {
          for (let d = 0; d <= Math.min(dbls.length, s.playsLeft - 1); d++) {
            const base = { t: 'play', card: id, color: col, doubles: dbls.slice(0, d) };
            if (c.colors === 'any') opp.forEach(t => out.push({ ...base, target: t })); else out.push(base);
          }
        });
      }
      if (c.k === 'act') {
        switch (c.a) {
          case 'passgo': case 'birthday': out.push({ t: 'play', card: id }); break;
          case 'debt': opp.forEach(t => out.push({ t: 'play', card: id, target: t })); break;
          case 'house': case 'hotel': p.stacks.forEach(st => { if (complete(st)) out.push({ t: 'play', card: id, sid: st.sid }); }); break;
          case 'dealbreaker': opp.forEach(t => s.players[t].stacks.forEach(st => { if (complete(st)) out.push({ t: 'play', card: id, target: t, sid: st.sid }); })); break;
          case 'sly': opp.forEach(t => s.players[t].stacks.forEach(st => { if (!complete(st)) st.cards.forEach(x => out.push({ t: 'play', card: id, target: t, take: x })); })); break;
          case 'forced': {
            const mine = p.stacks.filter(st => !complete(st)).flatMap(st => st.cards);
            opp.forEach(t => s.players[t].stacks.forEach(st => { if (!complete(st)) st.cards.forEach(x => mine.forEach(g => out.push({ t: 'play', card: id, target: t, take: x, give: g }))); }));
            break;
          }
        }
      }
    });
    // başka hiçbir oynanabilir kart yoksa ve oynamak zorundaysa (7+ kart) son çare
    if (E.mustPlay(s) && !out.some(x => x.t !== 'move')) return out.concat(lone);
    return out;
  }

  // bazı hamlelerin değeri rakibin Reddet ihtimaline göre biraz düşürülür (rakibin elini görmeyiz)
  // İnsan oyunlarından öğrenme: kurucunun tarayıcısında biriken istatistiklere göre küçük bir eğilim (yalnızca tarayıcıda)
  function learnBonus(s, seat, a) {
    const L = (typeof BotLearn !== 'undefined') ? BotLearn : null;
    if (!L || TUNE.noLearn) return 0;
    return L.bonus(s, seat, a);
  }
  // Rakip takibi: Reddet kartlarından hangileri görüldü (atılan deste, bankalar, benim elim)?
  // Kalan görünmeyen Reddet'lerin, hedefin elinde olma olasılığını hesaplar. Rakibin elini görmez.
  const JSN_TOTAL = (E.ACTS && E.ACTS.jsn && E.ACTS.jsn.n) || 3;
  function jsnProb(s, me, t) {
    const isJ = id => isAct(id, 'jsn');
    let seen = s.discard.filter(isJ).length + s.players[me].hand.filter(isJ).length;
    s.players.forEach(q => { seen += q.bank.filter(isJ).length; });
    const rem = Math.max(0, JSN_TOTAL - seen);
    if (!rem) return 0;
    let unseen = s.deck.length; s.players.forEach((q, i) => { if (i !== me) unseen += q.hand.length; });
    if (unseen <= 0) return 0;
    const h = s.players[t].hand.length;
    let pNone = 1; for (let k = 0; k < h; k++) pNone *= Math.max(0, (unseen - rem - k) / (unseen - k));
    return 1 - pNone;
  }
  function jsnRisk(s, a) {
    if (a.t !== 'play') return 0;
    const c = C(a.card); if (c.k !== 'act' && c.k !== 'rent') return 0;
    if (c.k === 'act' && (c.a === 'passgo' || c.a === 'house' || c.a === 'hotel')) return 0;
    const me = s.turn;
    const tgts = a.target != null ? [a.target] : others(s, me);
    if (TUNE.oldRisk) { const hs = tgts.reduce((x, t) => x + s.players[t].hand.length, 0); return Math.min(0.5, 0.04 * hs); }
    const pr = tgts.reduce((x, t) => x + jsnProb(s, me, t), 0) / Math.max(1, tgts.length);
    return Math.min(0.85, pr * (TUNE.jsnRiskW ?? 0.9));
  }

  function play(s, seat) {
    const p = s.players[seat];
    if (s.phase === 'discard') {
      const n = p.hand.length - 7;
      return { t: 'discard', cards: [...p.hand].sort((a, b) => handCardValue(s, p, a) - handCardValue(s, p, b)).slice(0, n) };
    }
    const base = evalFor(s, seat);
    let best = null, bestV = -Infinity;
    const cands = candidates(s, seat);
    const scored = [];
    for (const a of cands) {
      // rastgele çekişli hamlelerde birkaç örnek al
      const samples = (a.t === 'play' && isAct(a.card, 'passgo')) ? 3 : 1;
      let v = 0, ok = true;
      for (let k = 0; k < samples; k++) { const st = simulate(s, seat, a); if (!st) { ok = false; break; } v += evalFor(st, seat); }
      if (!ok) continue;
      v /= samples;
      if (v >= 1e5) return a; // kazandıran hamle
      const risk = jsnRisk(s, a);
      v = base + (v - base) * (1 - risk) - (risk ? 1 : 0);
      if (a.t === 'move' && v - base < 4) continue; // gereksiz oynamayı önle
      v += learnBonus(s, seat, a);
      scored.push({ a, v });
    }
    // 2. adım: en iyi birkaç hamle için, aynı sırada ardından gelecek en iyi hamleyi de düşün
    scored.sort((x, y) => y.v - x.v);
    const depth2 = s._depth ? 0 : TUNE.d2;
    scored.forEach((o, i) => {
      let v = o.v;
      if (i < depth2) {
        const st = simulate(s, seat, o.a);
        if (st && st.turn === seat && st.phase === 'play' && !st.pending && st.playsLeft > 0) {
          st._depth = 1;
          let b2 = -Infinity;
          for (const b of candidates(st, seat)) { if (b.t === 'move') continue; const st2 = simulate(st, seat, b); if (!st2) continue; const v2 = evalFor(st2, seat); if (v2 > b2) b2 = v2; }
          if (b2 > v) v = v * 0.4 + b2 * 0.6;
        }
      }
      if (v > bestV) { bestV = v; best = o.a; }
    });
    const canEnd = !E.mustPlay(s);
    // 3 hamleyi doldurmak zorunda değil: hamle kartını bankaya koymak gibi küçük kazançlar için kart harcama
    const need = best && best.t === 'bank' && C(best.card).k !== 'money' ? TUNE.bankActMin : 1;
    if (best && (bestV > base + need || !canEnd)) return best;
    if (!canEnd && cands.length) return cands.find(a => a.t !== 'move') || cands[0];
    return { t: 'end' };
  }

  // ---------- ödeme: en az kaybettiren kartlar ----------
  function removeSim(p, id) {
    const q = cloneS(p);
    const bi = q.bank.indexOf(id); if (bi >= 0) { q.bank.splice(bi, 1); return q; }
    for (const st of q.stacks) {
      if (st.house === id) { st.house = null; if (st.hotel != null) { q.bank.push(st.hotel); st.hotel = null; } return q; }
      if (st.hotel === id) { st.hotel = null; return q; }
      const i = st.cards.indexOf(id);
      if (i >= 0) { st.cards.splice(i, 1); if (!complete(st)) { [st.house, st.hotel].forEach(x => { if (x != null) q.bank.push(x); }); st.house = st.hotel = null; } if (!st.cards.length) q.stacks.splice(q.stacks.indexOf(st), 1); return q; }
    }
    return q;
  }
  function receiverGain(s, recv, id) {
    if (recv == null) return 0;
    const c = C(id); if (c.k !== 'prop' && c.k !== 'wild') return 0;
    const r = s.players[recv];
    const cols = c.k === 'prop' ? [c.color] : (c.colors === 'any' ? CK : c.colors);
    let g = 0;
    cols.forEach(col => {
      const best = r.stacks.filter(st => st.color === col && !complete(st)).reduce((m, st) => Math.max(m, st.cards.length), 0);
      const size = COLORS[col].size;
      g = Math.max(g, best + 1 >= size ? 140 : best > 0 ? 25 * (best + 1) / size : 4);
    });
    return g;
  }
  function payChoice(s, seat, amount, recv) {
    const p = s.players[seat];
    const all = assetIds(p).filter(id => C(id).v > 0);
    const total = all.reduce((x, id) => x + C(id).v, 0);
    if (total <= amount) return all;
    const bank = p.bank.filter(id => C(id).v > 0);
    const bankSum = bank.reduce((x, id) => x + C(id).v, 0);
    if (bankSum >= amount) {
      // en az fazla ödeyen alt küme (değerler küçük: DP)
      const best = new Map([[0, []]]);
      bank.forEach(id => { const v = C(id).v; [...best.entries()].forEach(([sum, ids]) => { const ns = sum + v; if (!best.has(ns) || best.get(ns).length > ids.length + 1) best.set(ns, [...ids, id]); }); });
      const sums = [...best.keys()].filter(x => x >= amount).sort((a, b) => a - b);
      return best.get(sums[0]);
    }
    // bankanın hepsi + en az kayıplı masa kartları
    let pick = [...bank], sum = bankSum, cur = p;
    const base = posScore(s, p, true);
    while (sum < amount) {
      const opts = assetIds(cur).filter(id => !pick.includes(id) && C(id).v > 0);
      if (!opts.length) break;
      let bestId = null, bestScore = Infinity;
      opts.forEach(id => {
        const after = removeSim(cur, id);
        const loss = posScore(s, cur, true) - posScore(s, after, true) + receiverGain(s, recv, id) * 0.6;
        const need = amount - sum, v = C(id).v;
        const sc = loss / Math.min(v, need) + (v > need ? (v - need) * 0.8 : 0);
        if (sc < bestScore) { bestScore = sc; bestId = id; }
      });
      pick.push(bestId); sum += C(bestId).v; cur = removeSim(cur, bestId);
    }
    // fazlalığı at (önce en değerli)
    pick.sort((a, b) => C(b).v - C(a).v);
    for (let i = 0; i < pick.length; i++) if (sum - C(pick[i]).v >= amount) { sum -= C(pick[i]).v; pick.splice(i, 1); i--; }
    void base;
    return pick;
  }

  // ---------- yanıtlar (Reddet kararı) ----------
  function respond(s, seat) {
    const pd = s.pending, p = s.players[seat];
    const hasJ = p.hand.some(id => isAct(id, 'jsn'));
    const now = evalFor(s, seat);
    if (pd.stage === 'actor') {
      if (!hasJ) return { t: 'accept' };
      // karşı Reddet: hamlem geçerli olursa ne kazanırım?
      const st = cloneS(s); const j = st.players[seat].hand.find(id => isAct(id, 'jsn'));
      const r = E.apply(st, seat, { t: 'jsn' }); if (!r.ok) return { t: 'accept' };
      // rakip tekrar reddetmezse
      const st2 = cloneS(st);
      if (st2.pending && st2.pending.stage === 'target') {
        const w = st2.pending.cur;
        const a = st2.pending.kind === 'steal' ? { t: 'accept' } : { t: 'pay', cards: payChoice(st2, w, st2.pending.amount, seat) };
        E.apply(st2, w, a); resolve(st2, seat);
      }
      const gain = evalFor(st2, seat) - now;
      void j;
      return gain > TUNE.jsnKeep + 6 ? { t: 'jsn' } : { t: 'accept' };
    }
    // hedef benim
    let accept;
    if (pd.kind === 'steal') accept = { t: 'accept' };
    else accept = { t: 'pay', cards: payChoice(s, seat, pd.amount, pd.actor) };
    if (!hasJ) return accept;
    const st = cloneS(s); E.apply(st, seat, accept);
    // aynı hamlenin diğer hedeflerini dahil etmeden sadece kendi kaybım
    const loss = now - evalFor(st, seat);
    const threshold = TUNE.jsnKeep + 8;
    if (pd.act === 'dealbreaker' || loss > threshold) return { t: 'jsn' };
    return accept;
  }

  function decide(s, seat, params) {
    const keep = TUNE;
    if (params) TUNE = Object.assign({}, DEF, params);
    try {
      const a = s.pending ? respond(s, seat) : play(s, seat);
      return a;
    } catch (e) { if (typeof console !== 'undefined') console.warn('BotPro hata', e); return null; }
    finally { TUNE = keep; }
  }
  return { decide, evalFor, payChoice, DEF, setDefaults: o => { Object.assign(DEF, o); TUNE = Object.assign({}, DEF, ENV); } };
})();

// Bot seçimi: oyun "kolay" ise eski bot, değilse güçlü bot
(function () {
  const B = (typeof Bot !== 'undefined') ? Bot : require('./bot.js');
  const easy = B.decide, easyFallback = B.fallback;
  B.decide = (s, seat) => {
    // bot seviyesi seçimi kaldırıldı: hep güçlü bot
    return BotPro.decide(s, seat) || easy(s, seat);
  };
  B.fallback = (s, seat) => easyFallback(s, seat);
  if (typeof module !== 'undefined') module.exports = { BotPro, Bot: B };
})();

// ===== İNSAN OYUNLARINDAN ÖĞRENME =====
// Botları çalıştıran tarayıcı (bot masası ya da online oyunun kurucusu), insan oyuncuların hamlelerini kaydeder.
// Oyun bitince kazananın hamleleri 2 kat, diğerlerininki 1 kat sayılır. Bot, benzer durumda insanların
// (özellikle kazananların) sık seçtiği hamle türlerine küçük bir eğilim kazanır. Kurallar ve sabit kurallar değişmez.
const BotLearn = (() => {
  const KEY = 'deal_learn_v1';
  let db = null;
  const load = () => { if (db) return db; try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} if (!db || !db.c) db = { c: {}, n: 0, games: 0 }; return db; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
  const C = id => Engine.C(id);
  const phase = s => (s.turnNo <= 3 * s.players.length ? 'e' : s.turnNo <= 8 * s.players.length ? 'm' : 'l');
  function key(s, seat, a) {
    if (!a) return null;
    if (a.t === 'end') return s.playsLeft > 0 ? 'end-early' : null;
    if (a.t === 'bank') { const c = C(a.card); return c.k === 'money' ? (c.v <= 2 ? 'bank-small' : 'bank-big') : 'bank-' + (c.k === 'act' ? c.a : c.k); }
    if (a.t === 'prop') return C(a.card).k === 'wild' ? 'prop-wild' : 'prop';
    if (a.t === 'move') return 'move';
    if (a.t === 'play') { const c = C(a.card); if (c.k === 'rent') return 'rent' + ((a.doubles || []).length ? '-x2' : ''); return 'play-' + c.a; }
    return null;
  }
  let buf = [];
  function record(s, seat, a) {
    if (!s || s.phase !== 'play' || s.pending || s.turn !== seat) return;
    const p = s.players[seat]; if (!p || p.bot) return;
    const k = key(s, seat, a); if (!k) return;
    buf.push({ seat, ctx: phase(s), k });
  }
  function gameOver(s) {
    if (!buf.length) return;
    const d = load();
    buf.forEach(r => { const w = r.seat === s.winner ? 2 : 1; const kk = r.ctx + '|' + r.k; d.c[kk] = (d.c[kk] || 0) + w; d.n += w; });
    d.games++; buf = []; save();
  }
  function reset() { buf = []; }
  // bonus: insanlar bu bağlamda bu tür hamleyi ortalamadan sık seçiyorsa +, az seçiyorsa −. Veri azken etkisiz.
  function bonus(s, seat, a) {
    const d = load(); if (d.n < 60) return 0;
    const k = key(s, seat, a); if (!k) return 0;
    const ctx = phase(s); let tot = 0, kinds = 0;
    for (const kk in d.c) if (kk.startsWith(ctx + '|')) { tot += d.c[kk]; kinds++; }
    if (tot < 30 || !kinds) return 0;
    const share = (d.c[ctx + '|' + k] || 0) / tot, avg = 1 / kinds;
    const conf = Math.min(1, d.n / 600);
    return Math.max(-5, Math.min(5, 3 * Math.log((share + 0.01) / (avg + 0.01)))) * conf;
  }
  const stats = () => { const d = load(); return { moves: d.n, games: d.games }; };
  return { record, gameOver, reset, bonus, stats };
})();

function cardSecs(secs, sel = new Set()) {
  // bölümler halinde gerçek kartlar; kart boyu ekrana sığacak şekilde (render sonrası ayrıca küçültülür)
  const availW = window.innerWidth - 44, availH = window.innerHeight - 88, GAP = 5, PAD = 16, LBL = 34;
  const fits = cw => {
    let x = 0, lines = 1;
    for (const sec of secs) {

      while (w > availW) { if (x > 0) { lines++; x = 0; } const per = Math.max(1, Math.floor((availW - PAD + GAP) / (cw + GAP))); w -= per * (cw + GAP); lines++; }
      if (x > 0 && x + w + 8 > availW) { lines++; x = 0; }

    }
    return lines * (cw * 1.42 + LBL + 10) <= availH;

    const col = COLORS[st.color];
    const cards = st.cards.map(id => ({ id, color: st.color, dis: !(C(id).v > 0), k: toggle(id) }));
    if (st.house != null) cards.push({ id: st.house, k: toggle(st.house) }); if (st.hotel != null) cards.push({ id: st.hotel, k: toggle(st.hotel) });
    secs.push({ label: `${col.n} ${st.cards.length}/${col.size}${Engine.complete(st) ? ' ✓' : ''}`, hex: col.hex, cards });
  });
  const body = cardSecs(secs, sel);
  const pct = Math.min(100, Math.round(100 * sum / Math.max(1, Math.min(pd.amount, total))));
  const kAuto = cb(() => { app.ui.sel = new Set(Bot.choosePayment(p, pd.amount)); render(); });
  const kPay = cb(() => send({ t: 'pay', cards: [...sel] }));
  return `<!--sheet--><div class="pay-top"><div class="pt"><b>${describePending(s)}</b>
      <div class="meter"><i style="width:${pct}%"></i><span>Seçilen <b>${sum}M</b> / borç <b>${pd.amount}M</b>${total < pd.amount ? ` · varlığın ${total}M, hepsini vermelisin` : ' · para üstü verilmez'}</span></div></div>
    <div class="pa">${jsn ? `<button class="danger" data-k="${cb(() => send({ t: 'jsn' }))}">✋ Reddet (${jsn})</button>` : ''}<button data-k="${kAuto}">Otomatik</button><button class="primary" ${valid ? '' : 'disabled'} data-k="${kPay}">${sum ? `${sum}M öde` : 'Öde'}</button></div></div>
    ${body}`;
}
function oppModal(m) {
  const s = S(), my = app.mySeat, n = s.players.length;
  const others = my < 0 ? s.players.map((_, i) => i) : Array.from({ length: n - 1 }, (_, k) => (my + 1 + k) % n);
  const p = s.players[m.seat];
  const tabs = others.length > 1 ? `<div class="row lp-tabs">${others.map(i => `<button class="${i === m.seat ? 'primary' : 'ghost'}" data-k="${cb(() => openModal({ type: 'opp', seat: i }))}">${pname(i)}</button>`).join('')}</div>` : '';
  return `<h3>${pname(m.seat)} <span class="pill gold">Set ${Engine.countSets(p, s)}/${s.target || 3}</span> <span class="pill">Elinde ${p.hand.length} kart</span> <span class="pill">Tapular ${propValue(p)}M</span></h3>${tabs}
    ${trayHTML(p, true)}<div class="stacks lp-big">${p.stacks.map(st => tileHTML(st, m.seat, true)).join('') || '<span class="muted">Tapu yok</span>'}</div>
    <div class="row"><button class="primary" data-k="${cb(closeModal)}">Kapat</button></div>`;
}
function menuModal() {
  return `<h3>Menü</h3><div class="opts">
    ${optBtn('Oyun kaydı', 'Tüm hamleler', () => openModal({ type: 'log' }))}
    <div class="muted" style="font-size:12px">${(() => { try { const t = BotLearn.stats(); return `Botlar bu cihazda ${t.games} oyundan öğrendi (${t.moves} hamle).`; } catch (e) { return ''; } })()}</div>
    ${optBtn('Kurallar', '', () => openModal({ type: 'rules' }))}
    ${optBtn(LANG === 'en' ? 'Türkçe' : 'English', LANG === 'en' ? 'Dili değiştir' : 'Change language', () => { setLang(LANG === 'en' ? 'tr' : 'en'); app.ui.modal = null; render(); })}
    ${app.local ? '' : optBtn('Oyun kodu: ' + esc(app.code || ''), 'Arkadaşlarına bu kodu ver', () => {})}
    ${optBtn('Oyundan çık', 'Ana sayfaya dön', () => { app.ui.modal = null; goHome(); })}
  </div>${cancelBtn()}`;
}

// ---------- OYUN ----------
function gameHTML() {
  const s = S();
  if (!s) return `<div class="lobby"><h2>Yükleniyor…</h2></div>`;
  if (isLand()) return landHTML();
  if (isPortraitPhone()) return portHTML();
  const n = s.players.length, my = app.mySeat;
  const spectator = my < 0;
  const order = spectator ? s.players.map((_, i) => i) : Array.from({ length: n - 1 }, (_, k) => (my + 1 + k) % n);
  const tp = s.players[s.turn];
  const dots = [0, 1, 2].map(i => `<i class="${i < s.playsLeft ? 'on' : ''}"></i>`).join('');
  const kEnd = cb(() => send({ t: 'end' }));
  const top = `<div class="topbar">
    <button class="ghost" data-k="${cb(goHome)}">← Çık</button>
    <span class="turn">Sıra: ${esc(tp.name)}${s.turn === my ? ' (sen)' : ''}</span>
    <span>Hamle <span class="dots">${dots}</span></span>
    <span class="pill">Deste ${s.deck.length}</span><span class="pill">Tur ${s.turnNo}</span>
    ${app.local ? '<span class="pill bot">Bot masası</span>' : `<span class="pill codepill">Kod <span class="code">${esc(app.code)}</span></span>`}
    ${app.netStatus === 'down' ? '<span class="pill codepill" style="background:#b5382b">Bağlantı koptu, yeniden bağlanıyor…</span>' : ''}
    <span class="spacer"></span>
    <button data-k="${cb(() => openModal({ type: 'log' }))}" class="ghost">Kayıt</button>
    <button data-k="${cb(() => openModal({ type: 'rules' }))}" class="ghost">Kurallar</button>
    ${myTurnFree() ? (Engine.mustPlay(s) ? `<button class="primary" disabled title="Elinde 7'den fazla kart var: önce hamlelerini tamamla">Sırayı bitir</button>` : `<button class="primary" data-k="${kEnd}">Sırayı bitir</button>`) : ''}
  </div>`;
  const opps = `<div class="seats n${order.length}">${order.map(i => oppHTML(i)).join('')}</div>`;
  let mineHtml = '';
  if (!spectator) {
    const p = me();
    const canMove = myTurnFree();
    const stacks = p.stacks.map(st => tileHTML(st, app.mySeat, true)).join('') || '<span class="muted">Henüz tapu açmadın.</span>';
    const bank = trayHTML(p, true);
    mineHtml = `<div class="seat me ${s.turn === my ? 'active' : ''}">
      <div class="head"><span class="av me">${esc((p.name || '?')[0].toUpperCase())}</span><b>Sen</b><span class="pill gold">Set ${Engine.countSets(p, s)}/${s.target || 3}</span><span class="pill">Tapular ${propValue(p)}M</span>${canMove && p.stacks.some(st => st.cards.some(id => C(id).k === 'wild')) ? '<span class="muted hint-move">Jokerin rengini değiştirmek için gruba dokun.</span>' : ''}</div>
      ${bank}
      <div class="stacks">${stacks}</div></div>`;
  }
  const status = statusHTML();
  const top1 = s.discard.length ? s.discard[s.discard.length - 1] : null;
  const L = s.last;
  const center = `<div class="center">
    <div class="pilebox"><div class="deckpile">${Array.from({ length: Math.min(4, Math.ceil(s.deck.length / 12)) }, (_, i) => `<div style="position:absolute;top:${-i * 2}px;left:${i * 2}px">${backHTML('md')}</div>`).join('')}</div>Deste · ${s.deck.length}</div>
    <div class="pilebox"><div class="discpile">${top1 != null ? cardHTML(top1, { size: 'md' }) : '<span class="muted">boş</span>'}</div>Yer</div>
    <div class="lastplay">${L ? `<div class="muted" style="font-size:11px">SON HAMLE</div>${lastText(L)}` : '<span class="muted">Henüz kart oynanmadı.</span>'}</div></div>`;
  const log = `<div class="logbox" aria-live="polite">${status}${s.log.slice().reverse().slice(0, 30).map(l => `<div>${esc(l)}</div>`).join('')}</div>`;
  let handHtml = '';
  if (!spectator) {
    const p = me();
    const free = myTurnFree() && s.playsLeft > 0;
    handHtml = `<div class="handbar"><div class="row"><b>Elin (${p.hand.length})</b><span class="muted" style="font-size:13px">${free ? 'Oynamak istediğin karta tıkla.' : (s.turn === my && s.phase === 'discard' ? 'Fazla kartları atman gerekiyor.' : 'Kartlara bakabilirsin; sıra sende değil.')}</span></div>
      <div class="hand arc">${p.hand.map((id, i) => { const n = p.hand.length, off = i - (n - 1) / 2, step = Math.min(5, 36 / Math.max(n, 1));
        return `<div class="hs" style="--r:${(off * step).toFixed(1)}deg;--y:${(Math.abs(off) * Math.abs(off) * (n > 8 ? 1.2 : 2.2)).toFixed(1)}px;margin-left:${i ? handGap(n) : 0}px">${cardHTML(id, { k: cb(() => openModal({ type: 'card', id })) })}</div>`; }).join('')}</div></div>`;
  }
  const rot = isPortraitPhone() ? '<div class="rot-hint">↻ Daha rahat oynamak için telefonu yan çevir</div>' : '';
  return `<div class="game rt">${top.replace('<div class="topbar">', '<div class="topbar">' + rot)}
    <div class="table"><div class="oval" aria-hidden="true"></div>
      
      ${opps}
      <div class="pot">${center}${status}</div>
      ${mineHtml}
    </div>${handHtml}</div>`;
}

function lastText(L) {
  const s = S(); const who = `<b>${pname(L.seat)}</b>`; const c = C(L.card);
  const nm = c.k === 'act' ? Engine.ACTS[c.a].name : c.k === 'rent' ? (c.colors === 'any' ? 'Joker Kira' : 'Kira') : c.k === 'money' ? c.v + 'M' : c.name;
  switch (L.kind) {
    case 'bank': return `${who} bankaya koydu: ${esc(nm)}`;
    case 'prop': return `${who} tapu açtı: ${esc(c.k === 'prop' ? c.name : 'Joker → ' + COLORS[L.color].n)}`;
    case 'move': return `${who} jokeri ${COLORS[L.color].n} rengine taşıdı`;
    case 'rent': return `${who} ${COLORS[L.color].n} için ${L.amount}M kira istedi${L.doubles ? ' (x' + Math.pow(2, L.doubles) + ')' : ''}`;
    case 'jsn': return `${who}: Reddet!`;
    default: return `${who} oynadı: ${esc(nm)}`;
  }
}

function showBld(B) {
  const el = document.createElement('div'); el.className = 'flyin bldfly';
  el.style.setProperty('--dy', B.seat === app.mySeat ? '320px' : '-320px'); el.style.setProperty('--rot', '0deg');
  const total = B.cards.reduce((x, id) => x + C(id).v, 0);
  el.innerHTML = tx(`<div class="row" style="flex-wrap:nowrap">${B.cards.map(id => cardHTML(id)).join('')}</div><div class="cap">${esc(S().players[B.seat].name)}: set bozuldu, ${B.cards.length > 1 ? 'ev ve otel' : (C(B.cards[0]).a === 'house' ? 'ev' : 'otel')} bankaya para olarak geçti (+${total}M)</div>`);
  setTimeout(() => { document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }, 900);
}

function showFly(L) {
  const s = S(); if (!L) return;
  const el = document.createElement('div'); el.className = 'flyin';
  const mine = L.seat === app.mySeat;
  el.style.setProperty('--dy', mine ? '320px' : '-320px');
  el.style.setProperty('--rot', mine ? '8deg' : '-10deg');
  el.innerHTML = tx(cardHTML(L.card, { color: L.kind === 'prop' || L.kind === 'move' ? L.color : null }) + `<div class="cap">${lastText(L).replace(/<\/?b>/g, '')}</div>`);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2050);
}

function handGap(n) {
  const land = false, mob = window.innerWidth < 720 || window.innerHeight < 520;
  const cw = land ? 58 : (mob ? 78 : 100), avail = Math.min(window.innerWidth, 1500) - (land ? 30 : (mob ? 40 : 70));
  if (n <= 1) return 0;
  return Math.round(Math.max(-cw * 0.7, Math.min(8, (avail - cw * n) / (n - 1))));
}
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (app.view === 'game') render(); }, 150); });

function miniTrayHTML(p) {
  const cnt = {}; p.bank.forEach(id => { const v = C(id).v; cnt[v] = (cnt[v] || 0) + 1; });
  return `<div class="minitray">${[1, 2, 3, 4, 5, 10].map(v => `<span class="${cnt[v] ? '' : 'z'}" style="--m:${MONEY_TINT[v]};--d:${MONEY_INK[v]}">${v}·${cnt[v] || 0}</span>`).join('')}</div>`;
}
function barsHTML(p) {
  if (!p.stacks.length) return '<span class="muted" style="font-size:11px">Tapu yok</span>';
  return `<div class="bars">${p.stacks.map(st => { const sz = COLORS[st.color].size, n = st.cards.length;
    return `<i class="${n >= sz ? 'done' : ''}" style="--c:${COLORS[st.color].hex}" title="${COLORS[st.color].n} ${n}/${sz}"><b style="height:${Math.round(100 * Math.min(n, sz) / sz)}%"></b></i>`; }).join('')}</div>`;
}
function oppHTML(i) {
  const s = S(), p = s.players[i];
  const open = app.ui.openOpps && app.ui.openOpps.has(i);
  const stacks = p.stacks.map(st => tileHTML(st, i, false)).join('') || '<span class="muted" style="font-size:12px">Tapu yok</span>';
  const kT = cb(() => { if (!app.ui.openOpps) app.ui.openOpps = new Set(); app.ui.openOpps.has(i) ? app.ui.openOpps.delete(i) : app.ui.openOpps.add(i); render(); });
  return `<div class="seat opp ${s.turn === i ? 'active' : ''} ${open ? 'open' : ''}">
    <button class="osum" type="button" data-k="${kT}" aria-expanded="${open}">
      <span class="av">${esc((p.name || '?')[0].toUpperCase())}</span>
      <span class="oc"><span class="l1"><b>${esc(p.name)}</b><span class="pill gold">Set ${Engine.countSets(p, s)}/${s.target || 3}</span><span class="muted">El ${p.hand.length} · ${bankTotal(p)}M</span><span class="chev">${open ? '▴' : '▾'}</span></span>
      <span class="l2">${miniTrayHTML(p)}${barsHTML(p)}</span></span>
    </button>
    <div class="odet">
    <div class="head"><span class="av">${esc((p.name || '?')[0].toUpperCase())}</span><span class="name">${esc(p.name)}</span>${p.bot ? '<span class="pill bot">BOT</span>' : ''}
    <span class="pill gold">Set ${Engine.countSets(p, s)}/${s.target || 3}</span><span class="pill pv">Tapular ${propValue(p)}M</span>
    <span class="fan" title="Elinde ${p.hand.length} kart">${Array.from({ length: Math.min(p.hand.length, 8) }, () => backHTML('xs')).join('')}</span><span class="pill hc">El ${p.hand.length}</span></div>
    ${trayHTML(p, false)}
    <div class="stacks">${stacks}</div></div></div>`;
}

function describePending(s) {
  const pd = s.pending; if (!pd) return '';
  const a = pname(pd.actor), t = pname(pd.cur);
  const what = {
    rent: `${a}, ${t} adlı oyuncudan ${pd.amount}M kira istiyor (${COLORS[pd.color]?.n || ''})`,
    debt: `${a}, ${t} adlı oyuncudan 5M tahsilat yapıyor`,
    birthday: `${a}'in doğum günü: ${t} 2M hediye ödeyecek`,
    sly: `${a}, ${t} adlı oyuncunun tapusunu almak istiyor (Tapu Devri)`,
    forced: `${a}, ${t} ile tapu takası yapmak istiyor (Değiş Tokuş)`,
    dealbreaker: `${a}, ${t} adlı oyuncunun TAM SETİNİ almak istiyor (Haciz)`,
  }[pd.act] || '';
  return what;
}

function statusHTML() {
  const s = S();
  if (s.phase === 'over') return `<div class="status">🏆 ${pname(s.winner)} kazandı!</div>`;
  const w = Engine.whoActs(s);
  if (s.pending) {
    const d = describePending(s);
    const resp = Engine.respondent(s);
    const extra = s.pending.stage === 'actor' ? ` · ${pname(s.pending.cur)} reddetti, ${pname(resp)} karar veriyor` : '';
    return `<div class="status ${resp === app.mySeat ? '' : 'wait'}">${d}${extra}${resp === app.mySeat ? ' · Yanıt sende!' : ' · yanıt bekleniyor…'}</div>`;
  }
  if (s.phase === 'discard') return `<div class="status ${w === app.mySeat ? '' : 'wait'}">${pname(s.turn)} fazla kartlarını atıyor…</div>`;
  if (w === app.mySeat && Engine.mustPlay(s)) return `<div class="status">Elinde ${me().hand.length} kart var: sırayı bitirmeden önce kalan ${s.playsLeft} hamleni yapmalısın.</div>`;
  if (w === app.mySeat) return s.playsLeft > 0 ? `<div class="status">Sıra sende: ${s.playsLeft} hamle hakkın var.</div>` : `<div class="status">Hamle hakkın bitti. Joker tapularını düzenleyip "Sırayı bitir"e bas.</div>`;
  return `<div class="status wait">${pname(w)} oynuyor…</div>`;
}

// ---------- PENCERELER ----------
function openModal(m) { app.ui.modal = m; app.ui.sel = new Set(); render(); }
function closeModal() { app.ui.modal = null; app.ui.sel = new Set(); render(); }

function autoModal() {
  // yanıt / kart atma / oyun sonu pencereleri durumdan otomatik açılır
  const s = S(); if (app.view !== 'game' || !s) return null;
  if (s.phase === 'over') return { type: 'over', closable: false };
  if (app.mySeat < 0) return null;
  if (s.pending && Engine.respondent(s) === app.mySeat) return { type: 'respond', closable: false };
  if (s.phase === 'discard' && s.turn === app.mySeat) return { type: 'discard', closable: false };
  return null;
}

function modalHTML() {
  if (app.view === 'game' && !app.local && !app.isHost && app.waitV != null && S() && app.waitV === S().v)
    return '<div class="veil"><div class="modal"><h3>Hamle gönderildi…</h3><div class="muted">Kurucunun tarayıcısı işliyor.</div></div></div>';
  const auto = autoModal();
  let m = app.ui.modal;
  let pill = '';
  // yanıt sırasında masaya bakmak için istek sayfası küçültülebilir; yanıt vermek yine zorunlu (oyun bekler)
  if (auto && auto.type !== 'over' && app.ui.minKey === stateKey()) {
    const s = S();
    const txt = auto.type === 'respond' ? describePending(s) : `Elinde ${me().hand.length} kart var: ${me().hand.length - 7} kart atmalısın`;
    pill = `<div class="minpill" role="status"><span class="pulse"></span><span class="t">${txt}</span><button class="primary" data-k="${cb(() => { app.ui.minKey = null; app.ui.modal = null; app.ui.sel = app.ui.respSel || new Set(); render(); })}">${auto.type === 'respond' ? 'Yanıtla' : 'Kart at'}</button></div>`;
    if (m && !['opp', 'set', 'card', 'log', 'rules', 'menu'].includes(m.type)) { app.ui.modal = m = null; }
    if (!m) return pill;
  } else if (auto) {
    if (!m || m.type !== auto.type || m.key !== stateKey()) {
      app.ui.modal = m = { ...auto, key: stateKey() };
      if (app.ui.selKey !== stateKey()) { app.ui.sel = new Set(); app.ui.selKey = stateKey(); }
    }
  } else if (m && ['respond', 'discard', 'over'].includes(m.type)) { app.ui.modal = m = null; }
  if (!m) return '';
  let body = '';
  try { body = renderModal(m); } catch (e) { console.error(e); body = '<h3>Bir hata oluştu</h3>'; }
  if (body == null) { app.ui.modal = null; return ''; }
  const kClose = cb(e => { if (e.target.classList.contains('veil') && m.closable !== false) closeModal(); });
  const fab = (m.type === 'respond' || m.type === 'discard') ? `<button class="minfab" data-k="${cb(() => { app.ui.minKey = stateKey(); app.ui.respSel = app.ui.sel; app.ui.modal = null; render(); })}">▾ Masaya bak</button>` : '';
  const vz = app.view === 'game' && isLand() && landZoom() > 1 ? (() => { const z = landZoom(); return ` style="zoom:${z.toFixed(3)};width:${(innerWidth / z).toFixed(1)}px;height:${(innerHeight / z).toFixed(1)}px;right:auto;bottom:auto"`; })() : '';
  return pill + fab + `<div class="veil"${vz} data-k="${kClose}"><div class="modal${body.startsWith('<!--sheet-->') ? ' sheet' : ''}" role="dialog" aria-modal="true" data-sk="m-${m.type}-${m.seat ?? ''}">${body}</div></div>`;
}
const stateKey = () => { const s = S(); return s ? `${s.v}|${s.pending ? s.pending.cur + s.pending.stage + s.pending.jsn : ''}` : ''; };

function optBtn(label, sub, fn, cls = '', dis = false) {
  return `<button class="${cls}" ${dis ? 'disabled' : ''} data-k="${cb(fn)}"><span>${label}</span>${sub ? `<small>${sub}</small>` : ''}</button>`;
}
const cancelBtn = () => `<div class="row"><button class="ghost" data-k="${cb(closeModal)}">Vazgeç</button></div>`;
const playThen = a => () => { app.ui.modal = null; send(a); };

function renderModal(m) {
  const s = S();
  if (m.type === 'rules') return `<h3>Kurallar</h3>${homeRules()}<div class="row"><button class="primary" data-k="${cb(closeModal)}">Tamam</button></div>`;
  if (m.type === 'over') {
    const kAgain = cb(() => { app.ui.modal = null; app.local ? startLocal() : hostRestart(); });
    return `<div class="win">🏆 ${pname(s.winner)} kazandı!</div><div class="muted" style="text-align:center">${s.turnNo}. turda ${s.target || 3} tam set tamamlandı.</div>
      <div class="row" style="justify-content:center">${app.local || app.isHost ? `<button class="primary" data-k="${kAgain}">Yeniden oyna</button>` : ''}<button data-k="${cb(() => { app.ui.modal = null; goHome(); })}">Ana sayfa</button></div>`;
  }
  if (m.type === 'respond') { const pd = s.pending; if (pd && pd.stage !== 'actor' && pd.kind !== 'steal') return payLand(); return respondModal(); }
  if (m.type === 'discard') return discardModal();
  if (m.type === 'move') return moveModal(m);
  if (m.type === 'set') return setModal(m);
  if (m.type === 'log') return `<h3>Oyun kaydı</h3><div class="logbox" style="max-height:60vh">${s.log.slice().reverse().map(l => `<div>${esc(l)}</div>`).join('')}</div><div class="row"><button class="primary" data-k="${cb(closeModal)}">Kapat</button></div>`;
  if (m.type === 'card') return cardModal(m);
  if (m.type === 'opp') return oppModal(m);
  if (m.type === 'menu') return menuModal();
  return null;
}

function homeRules() {
  return `<ul class="rules">
    <li><b>Kazanmak:</b> seçilen sayıda (varsayılan 3) tam set. Ev kuralı: aynı renkten ikinci bir tam set de sayılır (oyun kurulurken değiştirilebilir).</li>
    <li><b>Sıra:</b> 2 kart çek (el boşsa 5), en fazla 3 kart oyna, sonunda en fazla 7 kart tut. Elinde 7'den fazla kart varken hamle hakkın bitmeden sıranı bitiremezsin.</li>
    <li><b>Para/Aksiyon:</b> aksiyon kartlarını para olarak bankaya koyabilirsin; tapular bankaya konamaz.</li>
    <li><b>Ödeme:</b> banka ve masandan; para üstü yok. Yetmiyorsa her şeyini verirsin.</li>
    <li><b>Kira:</b> iki renkli kira herkesten, Joker Kira tek rakipten. İkiye Katla kira kartıyla birlikte oynanır ve ayrıca 1 hamle sayılır.</li>
    <li><b>Tapu Devri / Değiş Tokuş</b> tam setlerden kart alamaz. <b>Haciz</b> tam seti ev/otel ile birlikte alır.</li>
    <li><b>Ev</b> tam sete (+3M), <b>Otel</b> evli tam sete (+4M). İstasyon ve İdare'ye resmi kuralda konmaz; oyun kurulurken "Kurulabilir" seçildiyse konur. Set bozulursa ev/otel bankana para olarak geçer.</li>
    <li><b>Ev kuralı:</b> tam seti bozmak 1 hamle; set olmamış gruptaki jokeri taşımak ücretsiz.</li></ul>`;
}

function targetButtons(fn, filter = () => true) {
  const s = S();
  return `<div class="opts">${s.players.map((p, i) => i === app.mySeat || !filter(i) ? '' :
    optBtn(esc(p.name), `Banka ${bankTotal(p)}M · masa ${Engine.assetTotal(p) - bankTotal(p)}M`, () => fn(i))).join('')}</div>`;
}

function cardModal(m) {
  const s = S(), p = me(), id = m.id, c = C(id);
  const free = myTurnFree() && s.playsLeft > 0;
  const head = `<div class="row" style="align-items:flex-start;flex-wrap:nowrap">${cardHTML(id)}<div class="col"><h3>${esc(c.k === 'act' ? Engine.ACTS[c.a].name : c.k === 'rent' ? (c.colors === 'any' ? 'Joker Kira' : 'Kira') : c.name)}</h3>
    <div class="muted">${c.k === 'act' ? Engine.ACTS[c.a].d : c.k === 'money' ? 'Para kartı.' : c.k === 'rent' ? 'Kira hamle kartı.' : c.k === 'wild' ? 'Joker tapu senedi.' : 'Tapu senedi.'}${c.v ? ` Değeri ${c.v}M.` : ''}</div>
    ${!free ? '<div class="notice">Şu an bu kartı oynayamazsın' + (s.playsLeft <= 0 && s.turn === app.mySeat ? ' (hamle hakkın bitti).' : ' (sıra sende değil).') + '</div>' : ''}</div></div>`;
  if (!free) return head + cancelBtn();
  const step = m.step || 'main';
  const bankOpt = (c.k !== 'prop' && c.k !== 'wild') ? optBtn('Bankaya koy', `+${c.v}M para olarak`, playThen({ t: 'bank', card: id }), c.k === 'money' ? 'primary' : '') : '';
  const go = patch => () => openModalKeep({ ...m, ...patch });

  if (c.k === 'money') return head + `<div class="opts">${bankOpt}</div>` + cancelBtn();
  if (c.k === 'prop') return head + `<div class="opts">${optBtn('Tapu olarak aç', COLORS[c.color].n + ' setine', playThen({ t: 'prop', card: id }), 'primary')}</div>` + cancelBtn();
  if (c.k === 'wild') {
    const cols = c.colors === 'any' ? Engine.CK : c.colors;
    return head + `<div class="muted">Hangi renk olarak açılsın? Set olmadığı sürece rengini sonra ücretsiz değiştirebilirsin; tam seti bozmak 1 hamle.</div><div class="opts">${cols.map(col => optBtn(`<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${COLORS[col].hex};margin-right:8px;vertical-align:-1px"></span>Aç: ${COLORS[col].n}`, colorProgress(p, col), playThen({ t: 'prop', card: id, color: col }), '', false)).join('')}</div>` + cancelBtn();
  }
  if (c.k === 'rent') {
    const cols = (c.colors === 'any' ? Engine.CK : c.colors).filter(col => Engine.rentFor(p, col) > 0);
    const dbl = p.hand.filter(x => Engine.isAct(x, 'double'));
    if (step === 'main') {
      return head + `<div class="opts">${cols.length ? cols.map(col => optBtn(`Kira iste: ${COLORS[col].n}`, `${Engine.rentFor(p, col)}M ${c.colors === 'any' ? '· tek rakipten' : '· herkesten'}`, go({ step: 'dbl', color: col }), 'primary')).join('')
        : '<div class="notice">Bu kartın renklerinde kira alabileceğin tapun yok.</div>'}${bankOpt}</div>` + cancelBtn();
    }
    const base = Engine.rentFor(p, m.color);
    const maxD = Math.min(dbl.length, s.playsLeft - 1);
    if (step === 'dbl') {
      if (maxD <= 0) return renderModal({ ...m, step: 'target', doubles: [] });
      const opts = Array.from({ length: maxD + 1 }, (_, k) => optBtn(k === 0 ? 'Normal kira' : `${k} × İkiye Katla ekle`, `${base * Math.pow(2, k)}M · ${k + 1} hamle`, go({ step: 'target', doubles: dbl.slice(0, k) }), k ? 'primary' : '')).join('');
      return head + `<h3>Kirayı katlamak ister misin?</h3><div class="opts">${opts}</div>` + cancelBtn();
    }
    const doubles = m.doubles || [];
    if (c.colors !== 'any') {
      const amt = base * Math.pow(2, doubles.length);
      return head + `<div class="opts">${optBtn(`Herkesten ${amt}M kira iste`, COLORS[m.color].n, playThen({ t: 'play', card: id, color: m.color, doubles }), 'primary')}</div>` + cancelBtn();
    }
    return head + `<h3>Kimden ${base * Math.pow(2, doubles.length)}M kira isteyeceksin?</h3>` + targetButtons(t => { app.ui.modal = null; send({ t: 'play', card: id, color: m.color, doubles, target: t }); }) + cancelBtn();
  }
  // aksiyonlar
  switch (c.a) {
    case 'passgo': return head + `<div class="opts">${optBtn('Oyna: 2 kart çek', '1 hamle', playThen({ t: 'play', card: id }), 'primary')}${bankOpt}</div>` + cancelBtn();
    case 'birthday': return head + `<div class="opts">${optBtn('Oyna: herkes 2M öder', '', playThen({ t: 'play', card: id }), 'primary')}${bankOpt}</div>` + cancelBtn();
    case 'debt':
      if (step === 'target') return head + '<h3>Kimden 5M alacaksın?</h3>' + targetButtons(t => { app.ui.modal = null; send({ t: 'play', card: id, target: t }); }) + cancelBtn();
      return head + `<div class="opts">${optBtn('Oyna: rakip seç', '5M tahsil et', go({ step: 'target' }), 'primary')}${bankOpt}</div>` + cancelBtn();
    case 'house': case 'hotel': {
      const ok = p.stacks.filter(st => Engine.complete(st) && (s.railBuild || (st.color !== 'rail' && st.color !== 'util')) && (c.a === 'house' ? st.house == null : (st.house != null && st.hotel == null)));
      return head + `<div class="opts">${ok.map(st => optBtn(`${c.a === 'house' ? 'Ev' : 'Otel'} koy: ${COLORS[st.color].n}`, `kira ${rentOfStack(st)}M → ${rentOfStack(st) + (c.a === 'house' ? 3 : 4)}M`, playThen({ t: 'play', card: id, sid: st.sid }), 'primary')).join('')
        || `<div class="notice">${c.a === 'house' ? 'Ev için tamamlanmış bir set lazım.' : 'Otel için evli tamamlanmış bir set lazım.'}</div>`}${bankOpt}</div>` + cancelBtn();
    }
    case 'jsn': return head + `<div class="notice">Reddet kartı, biri sana hamle yaptığında otomatik olarak sorulur. Şimdi sadece bankaya koyabilirsin.</div><div class="opts">${bankOpt}</div>` + cancelBtn();
    case 'double': return head + `<div class="notice">Bir Kira kartına tıkladığında katlama seçeneği çıkar.</div><div class="opts">${bankOpt}</div>` + cancelBtn();
    case 'sly': case 'forced': {
      if (step === 'main') {
        const anyTake = s.players.some((q, i) => i !== app.mySeat && q.stacks.some(st => !Engine.complete(st)));
        const anyGive = c.a !== 'forced' || p.stacks.some(st => !Engine.complete(st));
        return head + `<div class="opts">${anyTake && anyGive ? optBtn(c.a === 'sly' ? 'Oyna: alacağın tapu senedini seç' : 'Oyna: takas edilecek tapu senetlerini seç', '', go({ step: 'take' }), 'primary')
          : `<div class="notice">${!anyTake ? 'Rakiplerin tamamlanmamış setlerinde alınabilecek tapu yok.' : 'Takas için tamamlanmamış bir setinde tapu olmalı.'}</div>`}${bankOpt}</div>` + cancelBtn();
      }
      const cancelTop = `<button class="ghost" data-k="${cb(closeModal)}">Vazgeç</button>`;
      if (step === 'take') {
        const secs = [];
        s.players.forEach((q, i) => {
          if (i === app.mySeat) return;
          q.stacks.filter(st => !Engine.complete(st)).forEach(st => {
            const col = COLORS[st.color];
            secs.push({ label: `${esc(q.name)} · ${col.n} ${st.cards.length}/${col.size}`, hex: col.hex, cards: st.cards.map(x => ({ id: x, color: st.color, k: cb(() => {
              if (c.a === 'sly') { app.ui.modal = null; send({ t: 'play', card: id, target: i, take: x }); }
              else openModalKeep({ ...m, step: 'give', target: i, take: x });
            }) })) });
          });
        });
        return sheetTop(c.a === 'sly' ? 'Tapu Devri: hangi tapuyu alacaksın?' : 'Değiş Tokuş: rakipten hangi tapuyu alacaksın?', 'Almak istediğin karta dokun. Tam setlerden alınamaz.', cancelTop) + cardSecs(secs);
      }
      if (step === 'give') {
        const tq = s.players[m.target], tcol = Engine.colorOnTable(tq, m.take);
        const secs = [{ label: `Alacağın · ${esc(tq.name)}`, hex: '#f5c518', cards: [{ id: m.take, color: tcol, ro: true, hl: true }] }];
        p.stacks.filter(st => !Engine.complete(st)).forEach(st => {
          const col = COLORS[st.color];
          secs.push({ label: `Senin ${col.n} ${st.cards.length}/${col.size}`, hex: col.hex, cards: st.cards.map(x => ({ id: x, color: st.color, k: cb(() => { app.ui.modal = null; send({ t: 'play', card: id, target: m.target, take: m.take, give: x }); }) })) });
        });
        return sheetTop('Değiş Tokuş: karşılığında hangi tapunu vereceksin?', 'Vereceğin karta dokun. Tam setlerinden veremezsin.', `<button class="ghost" data-k="${cb(() => openModalKeep({ ...m, step: 'take' }))}">← Geri</button>` + cancelTop) + cardSecs(secs);
      }
      break;
    }
    case 'dealbreaker': {
      const any = s.players.some((q, i) => i !== app.mySeat && q.stacks.some(Engine.complete));
      if (step === 'main') return head + `<div class="opts">${any ? optBtn('Oyna: alınacak seti seç', '', go({ step: 'set' }), 'primary') : '<div class="notice">Rakiplerin hiç tam seti yok.</div>'}${bankOpt}</div>` + cancelBtn();
      const secs = [];
      s.players.forEach((q, i) => {
        if (i === app.mySeat) return;
        q.stacks.filter(Engine.complete).forEach(st => {
          const col = COLORS[st.color], k = cb(() => { app.ui.modal = null; send({ t: 'play', card: id, target: i, sid: st.sid }); });
          const cards = st.cards.map(x => ({ id: x, color: st.color, k }));
          if (st.house != null) cards.push({ id: st.house, k }); if (st.hotel != null) cards.push({ id: st.hotel, k });
          secs.push({ label: `${esc(q.name)} · ${col.n} (kira ${rentOfStack(st)}M)`, hex: col.hex, k, cards });
        });
      });
      return sheetTop('Haciz: hangi tam seti alacaksın?', 'Sete dokun. Ev ve otel de setle birlikte gelir.', `<button class="ghost" data-k="${cb(closeModal)}">Vazgeç</button>`) + cardSecs(secs);
    }
  }
  return head + cancelBtn();
}
function openModalKeep(m) { app.ui.modal = m; render(); }
function colorProgress(p, col) {
  const best = p.stacks.filter(st => st.color === col).reduce((x, st) => Math.max(x, st.cards.length), 0);
  return `masada ${best}/${COLORS[col].size}`;
}
